name: Moonshot screener

# Weekly SEC Form 4 insider-cluster scan for the Moonshot book. Runs Saturday,
# off the weekday daily-mark schedule (daily.yml), since even after the
# concurrency fix a 90-day window measures out to roughly 4-5 hours (SEC's
# rate cap is the real bottleneck, not network latency -- see the throttle
# comments in engine/screener.py), and the marks pipeline shouldn't wait
# behind it. Output is CANDIDATES, not positions -- each still needs the
# other three Moonshot legs (analyst upside, dated catalyst, sentiment
# acceleration) before anything is bought.
#
# Publishes to the same GitHub Pages deployment as intraday.yml (this repo's
# Pages source is "workflow", not the docs/ branch -- committing docs/ alone
# does not update the live site) and pushes one ntfy notification with a
# #candidates deep link, so results show up on your phone within a minute or
# two of the scan finishing, not whenever intraday.yml next happens to run
# (it only runs on weekday market hours, which a Saturday scan would miss
# until Monday).

on:
  schedule:
    - cron: "0 14 * * 6"     # Saturday 14:00 UTC -- markets closed, no rush
  workflow_dispatch:          # run by hand from the Actions tab
    inputs:
      days_back:
        description: "Days to scan back (small number = quick manual test)"
        required: false
        default: "90"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-desk-screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Scan SEC Form 4 filings for insider clusters
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python -m engine.screener ${{ (github.event_name == 'workflow_dispatch' && inputs.days_back) || 90 }}

      - name: Rebuild dashboard with the new candidates
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          LIVE_QUOTE_KEY: ${{ vars.LIVE_QUOTE_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python -m engine.run report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Commit candidates and dashboard
        run: |
          git config user.name  "portfolio-desk[bot]"
          git config user.email "portfolio-desk@users.noreply.github.com"
          git add research/moonshot_candidates.json docs/index.html docs/data.json
          if git diff --staged --quiet; then
            echo "No new candidates."
          else
            git commit -m "research: moonshot candidates $(date -u +%Y-%m-%d) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              sleep 5
            done
            echo "::error::could not push candidates after 3 attempts"
            exit 1
          fi
