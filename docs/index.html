<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<title>Portfolio Desk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme: dark;
  --bg:#0a0a0b; --surface-1:#141416; --surface-2:#1c1c1f; --surface-3:#26262a;
  --border:#2a2a2e; --border-2:#3a3a40; --grid:#1f1f23;
  --ink:#f2f2f4; --ink-2:#a8a8b3; --ink-3:#6e6e7a;
  --good:#22c55e; --bad:#ef4444; --warn:#fab219;
  --s-core:#3987e5; --s-moon:#d95926; --s-ai:#199e70; --s-bench:#7a7a85;
  --r:12px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f6f6f4; --surface-1:#ffffff; --surface-2:#f0f0ee; --surface-3:#e6e6e3;
  --border:#e2e2de; --border-2:#cfcfc9; --grid:#eaeae7;
  --ink:#0b0b0b; --ink-2:#55555c; --ink-3:#8a8a92;
  --good:#0ca30c; --bad:#d03b3b;
  --s-core:#2a78d6; --s-moon:#eb6834; --s-ai:#1baf7a; --s-bench:#83827c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:14px 13px 60px}
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)} .dim{color:var(--ink-3)}
.lbl{font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px}
/* The header dot is a status light, not decoration. Grey by default: the page
   is static and honest about it. It only goes green, and only pulses, when
   live quotes actually came back. A light that is always green tells you
   nothing. */
.dotpulse{width:7px;height:7px;border-radius:50%;background:var(--ink-3);
  box-shadow:0 0 0 3px rgba(120,120,130,.12);transition:background .3s,box-shadow .3s}
.dotpulse.live{background:var(--good);box-shadow:0 0 0 3px rgba(34,197,94,.16);
  animation:pulse 2.4s ease-in-out infinite}
.dotpulse.partial{background:var(--warn);box-shadow:0 0 0 3px rgba(217,119,6,.16)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.dotpulse.live{animation:none}}
h1{font-size:14px;margin:0;letter-spacing:.02em;font-weight:650}
.stamp{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.stamp.live{color:var(--good)}
.tbtn{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);
  border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;font-weight:600}

/* hero */
.hero{background:linear-gradient(180deg,var(--surface-1),var(--bg));
  border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px}
.hero .big{font-size:clamp(30px,8vw,44px);font-weight:680;letter-spacing:-0.025em;line-height:1}
.deltas{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;align-items:baseline}
.delta{font-size:14px;font-weight:600}
.delta .lbl{display:block;margin-bottom:2px}
.strip{display:flex;gap:0;flex-wrap:wrap;margin-top:15px;padding-top:13px;
  border-top:1px solid var(--border)}
.strip>div{flex:1;min-width:88px;padding-right:12px}
.strip b{display:block;font-size:14px;font-weight:600;margin-top:3px}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:10px;
  margin-bottom:12px;overflow-x:auto}
.tab{flex:1;min-width:82px;border:0;background:transparent;color:var(--ink-3);
  padding:9px 8px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tab .dot{width:6px;height:6px;border-radius:50%;flex:none}
.tab[aria-selected="true"]{background:var(--surface-3);color:var(--ink)}

.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);
  padding:15px;margin-bottom:12px}
.card h2{font-size:12px;margin:0;font-weight:650;letter-spacing:.03em;text-transform:uppercase}
.note{font-size:11.5px;color:var(--ink-3);margin:5px 0 13px;line-height:1.5}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:11px;padding:11px 12px}
.tile .v{font-size:19px;font-weight:650;margin-top:4px;letter-spacing:-0.015em}
.tile .s{font-size:10.5px;color:var(--ink-3);margin-top:2px}

/* chart */
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ranges{display:flex;gap:3px;background:var(--surface-2);padding:2px;border-radius:7px}
.rbtn{border:0;background:transparent;color:var(--ink-3);font-size:10.5px;font-weight:600;
  padding:5px 9px;border-radius:5px;cursor:pointer;font-family:inherit}
.rbtn[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}
.chartbox{position:relative;height:250px;margin-top:12px}
@media(min-width:700px){.chartbox{height:320px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:13px;height:2.5px;border-radius:2px;margin-right:6px;vertical-align:3px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--s-bench) 0 4px,transparent 4px 8px)}

/* allocation */
.alloc{display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;font-size:11.5px}
.abar{height:13px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.abar span{display:block;height:100%;border-radius:3px}

/* holdings */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -15px;padding:0 15px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:right;font-weight:600;color:var(--ink-3);font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;padding:0 0 9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:10px 0 10px 10px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.tk{display:flex;align-items:center;gap:8px;font-weight:650}
.tk .sw{width:3px;height:16px;border-radius:2px;flex:none}
.pill{display:inline-block;font-size:8.5px;padding:2px 5px;border-radius:4px;margin-left:6px;
  font-weight:700;letter-spacing:.05em;vertical-align:1px;background:var(--surface-3);color:var(--ink-2)}
.pill.hm{background:rgba(34,197,94,.16);color:var(--good)}
.pill.ov{background:rgba(250,178,25,.16);color:var(--warn)}
.pcards{display:none;flex-direction:column;gap:8px}
.pcard{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 12px}
.pc1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pc1 .tk{font-size:13.5px}
.pc1 .px{font-size:13.5px;font-weight:650}
.pc2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pcell{background:var(--surface-1);border-radius:7px;padding:7px 9px}
.pcell .v{display:block;font-size:12.5px;font-weight:650;margin-top:2px}
.pc3{display:flex;gap:14px;margin-top:9px;font-size:10.5px;color:var(--ink-3)}
.pc3 b{color:var(--ink-2);font-weight:600}
@media(max-width:700px){
  th.opt,td.opt{display:none}
  .tw{display:none}
  .pcards{display:flex}
}

/* trades */
.trade{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--grid);font-size:12px}
.trade:last-child{border-bottom:0}
.side{font-size:9px;font-weight:800;padding:3px 6px;border-radius:4px;height:fit-content;
  flex:none;letter-spacing:.06em;min-width:38px;text-align:center}
.side.BUY{background:rgba(34,197,94,.14);color:var(--good)}
.side.SELL{background:rgba(239,68,68,.14);color:var(--bad)}
.tb{flex:1;min-width:0}
.th2{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px;font-weight:650}
.rsn{color:var(--ink-2);font-size:11.5px;line-height:1.5}
.meta{color:var(--ink-3);font-size:10.5px;margin-top:4px}

.banner{border-radius:10px;padding:11px 13px;font-size:12px;margin-bottom:12px;line-height:1.5}
.banner.halt{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.32)}
.banner.warn{background:rgba(250,178,25,.10);border:1px solid rgba(250,178,25,.32)}
.empty{color:var(--ink-3);font-size:12px;padding:22px 0;text-align:center;line-height:1.7}
details{margin-top:9px}
summary{cursor:pointer;font-size:11.5px;color:var(--ink-2);padding:7px 0;font-weight:600}
.thesis{font-size:11.5px;color:var(--ink-2);line-height:1.7;white-space:pre-wrap;
  background:var(--surface-2);border-radius:9px;padding:13px;margin-top:7px;
  max-height:340px;overflow:auto;font-family:ui-monospace,Menlo,monospace}

/* radar */
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.rhead h2{flex:1 1 60%;min-width:0}
.spill{font-size:8.5px;font-weight:700;letter-spacing:.05em;padding:3px 7px;border-radius:5px;
  max-width:100%;white-space:normal;line-height:1.4;background:var(--surface-3);color:var(--ink-2)}
.spill.bought{background:rgba(34,197,94,.16);color:var(--good)}
.spill.rej{background:rgba(239,68,68,.13);color:var(--bad)}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:11px}
@media(min-width:700px){.rgrid{grid-template-columns:repeat(4,1fr)}}
.rm{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.rm .v{display:block;font-size:11.5px;font-weight:650;margin-top:3px;line-height:1.35}
.rsec{margin-top:12px}
.rtext{font-size:11.5px;color:var(--ink-2);line-height:1.6}
.veh{font-size:11.5px;color:var(--ink-2);line-height:1.55;padding:7px 0;border-bottom:1px solid var(--grid)}
.veh:last-child{border-bottom:0}
.veh b{color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.rlist{margin:0;padding-left:17px;font-size:11.5px;color:var(--ink-2);line-height:1.8}
footer{text-align:center;color:var(--ink-3);font-size:10.5px;margin-top:26px;line-height:1.8}
</style>
</head>

venue +98.5% y/y \u00b7 EPS $2.03 (+240.2%)\n  Consensus target $391.77 = +21.8% upside, 26 analysts\n  Growth-adjusted 0.58 \u2014 among the best on the desk\n  52-week range $97.89\u2013$499.48 \u2014 currently 36% BELOW the high\n\nThis is the clearest illustration of why the gate uses a growth-adjusted\nmultiple rather than a raw one. 57x forward earnings looks indefensible until\nyou divide by 98.5% revenue growth and get 0.58, better than almost anything\nelse owned. Both facts are true at once.\n\nCLAIMS AND VERIFICATION\n  CLAIM  Record quarterly revenue of $392.4M, +27% sequentially and +104% y/y.\n  VERIFIED  Company reporting via stockanalysis.com, 14 Aug 2026.\n\n  CLAIM  Q3 guidance of $540\u2013560M.\n  VERIFIED  Same source. That implies roughly +38% sequential growth, which is\n  the single most impressive forward number I have found on this desk.\n\nWHY IT IS ONLY 5%\nA 57x forward multiple prices in flawless execution. One guidance miss and the\nmultiple compresses violently \u2014 the 36% drawdown from its high already shows\nhow that behaves. High conviction in the business, deliberately small position,\nbecause the price allows no room for error.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Any sequential guidance miss\n  \u00b7 Hyperscalers in-sourcing connectivity silicon\n  \u00b7 Growth decelerating below ~50% while the multiple stays above 50x\n","amd":"AMD \u2014 Advanced Micro Devices\nBook: AI Trade \u00b7 Opening weight 11.0% \u00b7 Horizon 12+ months\n\nWHY WE OWN IT\nThe AI trade is rotating from training to inference, and inference is a\nmemory-bound problem rather than a raw-FLOPS problem. That shift is the single\nmost important structural change in this sector right now, and AMD is better\npositioned in inference than it ever was in training. This is the highest-\nconviction name in the book and it gets the largest weight.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  Q2 2026 revenue was $11.5B, up 50% year over year.\n  VERIFIED  AMD investor relations, Q2 2026 results release (primary source).\n  Prior-year comparison $7.685B. Confirms.\n\n  CLAIM  Data center revenue grew 107% y/y to $6.718B, now 58% of the company.\n  VERIFIED  Same primary source. This is the number that matters: the data\n  center segment has crossed from a side business into the majority of AMD.\n\n  CLAIM  Margins are expanding, not being bought with price cuts.\n  VERIFIED  Non-GAAP gross margin 56% vs 43% a year ago. GAAP EPS $1.38,\n  +156% y/y. Growth is falling through to profit.\n\n  CLAIM  Q3 2026 guidance is ~$13B, +41% y/y.\n  VERIFIED  Company guidance in the same release, with a stated +/- $300M band.\n\n  CLAIM  AMD holds large-scale inference agreements with OpenAI, Meta,\n  Microsoft and Anthropic.\n  PARTIALLY CONFIRMED  Widely reported and consistent with company statements\n  at Advancing AI 2026, but I did not locate signed-contract terms in a filing.\n  Treated as supporting color, NOT as the load-bearing reason to own this.\n\n  CLAIM  Inference TAM reaches $1.3T by 2032 (32% CAGR), about 2x training.\n  UNVERIFIED  Sourced to Bloomberg Intelligence via secondary reporting. A\n  forecast, not a fact. Directionally useful, not relied upon.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Data center growth decelerating below ~40% y/y for two straight quarters\n  \u00b7 Gross margin rolling back under 50%\n  \u00b7 A named hyperscaler publicly standardizing away from AMD for inference\n  \u00b7 Total AI capex guidance across hyperscalers being cut\n\nEXIT CONDITIONS\nThesis-driven, plus the book's hard -20% stop from cost.\n","amzn":"AMZN \u2014 Amazon\nBook: Core \u00b7 Opening weight 7.5% \u00b7 Horizon multi-year\nNEW POSITION.\n\nWHY WE OWN IT\nAWS is the demand side of everything the AI book owns on the supply side, and\nretail plus advertising funds the capex without needing to raise money.\n\nVALUATION \u2014 the least comfortable pass in the Core book\n  Price $262.65 \u00b7 Market cap $2.83T\n  Trailing P/E 21.32 \u00b7 FORWARD P/E 28.54  \u2190 forward ABOVE trailing\n  Revenue +15.8% y/y \u00b7 Net income +91.6% y/y\n  Consensus target $326.07 = +24.2% upside, 60 analysts, Strong Buy\n  Growth-adjusted multiple 1.81 vs the 2.0 limit\n\nFLAGGED, per IPS 3a: the forward multiple sits above the trailing one, meaning\nconsensus expects earnings to fall. Net income up 91.6% is not a repeatable\nnumber, so trailing earnings are flattered and the honest multiple is 28.54x,\nnot 21.32x. Judged on that basis it still passes at 1.81 \u2014 but 1.81 against a\n2.0 limit is a scrape, and it is sized below META and GOOGL because of it.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 AWS growth decelerating while capex stays elevated\n  \u00b7 Retail margin compression\n  \u00b7 The 1.81 growth-adjusted figure deteriorating on the next print\n","avgo":"AVGO \u2014 Broadcom\nBook: AI Trade \u00b7 Opening weight 10.0% \u00b7 Horizon 12+ months\n\nWHY WE OWN IT\nThe hyperscalers all want to stop paying Nvidia's margin. Every one of them\nthat tries builds custom silicon, and Broadcom is who they build it with. This\nis the position that pays off in the scenario where NVDA disappoints \u2014 the\nin-book hedge that is also a good business on its own.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  Broadcom's custom AI accelerator business is described as a $100B+\n  opportunity in fiscal 2027.\n  PARTIALLY CONFIRMED  Reported via secondary source (Motley Fool, Aug 2026)\n  attributing the framing to the company. I did not confirm the figure in a\n  Broadcom filing or transcript. Directionally relied upon, NOT precisely.\n\n  CLAIM  Broadcom is a top-11 holding in Jim Cramer's Charitable Trust.\n  VERIFIED  Trust holdings list as of 30 June 2026. Noted only because this\n  book is explicitly benchmarked against him; it is not a reason to own it.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 A major hyperscaler abandoning its custom silicon program\n  \u00b7 Custom ASIC revenue growth decelerating while merchant GPU accelerates\n","cbrs":"CBRS \u2014 Cerebras Systems\nBook: Moonshot \u00b7 Opening weight 8.0% \u00b7 Horizon 12 months\n\nWHY WE OWN IT\nThis is the one name that currently fits the mandate you described: enormous\nsentiment, credible high price targets, a story running well ahead of profits,\nand a business early enough that the outcome is genuinely undecided. Wafer-scale\nchips with embedded SRAM are architecturally well-suited to exactly the\ninference workloads the market is rotating toward.\n\nCLAIMS AND VERIFICATION  (all figures from Cerebras investor relations, Q1 2026\nrelease \u2014 primary source)\n\n  CLAIM  Q1 2026 revenue of $193.4M, up 94% year over year.\n  VERIFIED  Confirms. Core revenue $191.3M, +92%.\n\n  CLAIM  Cloud and services revenue up 178% y/y to $82.8M.\n  VERIFIED  Confirms. The mix shift toward recurring cloud revenue is the most\n  encouraging line in the release and is the actual reason I am buying.\n\n  CLAIM  FY2026 core revenue guidance of $855-865M, ~+69% y/y at midpoint.\n  VERIFIED  Company guidance. Confirms.\n\n  CLAIM  A $20B+ multi-year OpenAI agreement covering 750MW of capacity.\n  VERIFIED  Disclosed by the company.\n\n  CLAIM  It is roughly break-even, not deeply lossmaking.\n  VERIFIED  GAAP net loss $(14.0)M, core net loss $(2.5)M on $193M revenue.\n  Unusual for a company at this growth rate and it materially de-risks the story.\n\nTHE RISKS, STATED PLAINLY  \u2014 I am not burying these\n\n  1. CUSTOMER CONCENTRATION. The company itself discloses dependence on \"a\n     limited number of significant customers, including OpenAI, Group 42\n     Holding Ltd, Mohamed bin Zayed University of Artificial Intelligence, and\n     AWS.\" If OpenAI reworks its commitment, the thesis breaks in one press\n     release. This is the single largest risk and it is disclosed by them, not\n     discovered by me.\n\n  2. IPO'd 14 May 2026 \u2014 about three months of public history. There are no\n     four public quarters to check management's guidance credibility against.\n     I cannot yet grade whether they do what they say.\n\n  3. GROSS MARGIN GUIDANCE OF 38-41% for FY26, DOWN from 47% core in Q1. The\n     company is guiding its own margins lower. That is either scale-up cost or\n     pricing pressure, and I do not yet know which.\n\n  4. Priced for a great outcome after the largest IPO of 2026.\n\nWHY IT IS 8% AND NOT MORE\nFour disclosed risks, three months of public history, and margin guidance\nmoving the wrong way. Conviction in the thesis does not entitle it to size.\n\nEXIT CONDITIONS\n  \u00b7 Any material change to the OpenAI relationship\n  \u00b7 FY26 core revenue guidance cut below $855M\n  \u00b7 Gross margin guided below 35%\n  \u00b7 The book's hard -25% stop from cost\n","ceg":"CEG \u2014 Constellation Energy\nBook: AI Trade \u00b7 Opening weight 7.5% \u00b7 Horizon 12+ months\n\nWHY WE OWN IT\nThe binding constraint on AI is shifting from chips to electricity. Data\ncenters need power that is carbon-free, always-on, and available at scale, and\nin the United States that describes the existing nuclear fleet almost uniquely.\nConstellation owns the largest one. This is the book's answer to the question\n\"what breaks first,\" and it is not correlated with the semiconductor names.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  AI data center demand is driving an electricity supercycle, with power\n  a genuine constraint on the buildout.\n  VERIFIED  GE Vernova Q2 2026 reported $2.7B of data center orders in\n  Electrification alone, first-half data center orders above $5B (more than\n  double all of 2025), and gas power \"mostly sold out through 2030.\" Independent\n  confirmation that power, not compute, is the scarce input.\n\n  CLAIM  Constellation specifically has contracted nuclear capacity to\n  hyperscaler data centers.\n  UNVERIFIED  I did not confirm current contract terms in a primary filing this\n  session. This is the weakest-verified position in the book and is sized\n  accordingly at 7.5%. It is on the list for primary-source verification at the\n  first monthly cycle, and I will cut it if the specifics do not hold up.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Power turning out not to be a binding constraint (watch GEV order growth)\n  \u00b7 Adverse regulatory treatment of behind-the-meter data center deals\n","cohr":"COHR \u2014 Coherent Corp\nBook: AI Trade \u00b7 Opening weight 6.5% \u00b7 Horizon 12+ months\nSOURCED BY THE EMERGING-THEME RADAR (IPS 3b), first run, 2026-08-14.\n\nWHY WE OWN IT\nThe AI bottleneck is migrating from the chip to the link between chips. At\ncluster scale, copper runs out of headroom on power and latency before it runs\nout of bandwidth, which forces optics into the package. Broadcom's own framing\nis the tell: \"our switches and XPUs are going to be lower power with optics than\nwith copper.\" Optics justify themselves on efficiency, not just speed \u2014 which\nmeans adoption is driven by the electricity bill, the hardest constraint there is.\n\nCoherent makes the optoelectronic components and engineered materials this\ntransition runs on.\n\nVALUATION\n  Price $325.83 \u00b7 Market cap $63.75B\n  Trailing P/E 79.09 \u00b7 Forward P/E 35.20   \u2190 forward BELOW trailing\n  Revenue +22.5% y/y \u00b7 Net income +1,530.7% y/y\n  Consensus target $410.76 = +26.1% upside, 22 analysts\n  Growth-adjusted 1.56 vs the 2.0 limit\n  52-week range $84.35\u2013$440.00 \u2014 currently 26% BELOW the high\n\nThat last line matters as much as the multiple. The optics complex has rallied\nhard, and buying a theme after it runs is how you lose money being right. This\none has already given back a quarter of its move.\n\nCLAIMS AND VERIFICATION\n  CLAIM  The Open Compute Interconnect standard was founded by AMD, Broadcom,\n  NVIDIA, Meta, Microsoft and OpenAI.\n  VERIFIED  OFC 2026 conference coverage. When six competitors agree a standard,\n  the direction is settled and only the timing is in question.\n\n  CLAIM  Volume production for CPO/silicon photonics integration targets 2028,\n  with full GPU-HBM package integration around 2029.\n  PARTIALLY CONFIRMED  Conference reporting, not company guidance. An industry\n  roadmap, and roadmaps slip.\n\n  CLAIM  NVIDIA invested $2B in Lumentum as part of a ~$4B optical strategy.\n  PARTIALLY CONFIRMED  Secondary reporting. Used as evidence the theme is real,\n  NOT as a reason to own this specific name.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 CPO timelines slipping past 2028 \u2014 the whole thesis is timing\n  \u00b7 Hyperscalers standardizing on pluggable optics for longer than expected\n  \u00b7 35x forward compressing toward the components-sector average\n","cost":"COST \u2014 Costco\nSTATUS: **REJECTED BY THE VALUATION GATE (IPS 3a)** on 2026-08-14. NOT OWNED.\n\nThis name was in my first roster. The client asked whether the good news was\nalready priced in. It was. The order was cancelled before any money moved.\n\n  Price               $961.10\n  Forward P/E         43.89\n  Implied upside      +12.1%   (floor is +15%)\n  Growth-adjusted     3.43   (limit is 2.0)\n\nWHY IT FAILED\n43.89x forward for 9.2% revenue growth. I flagged in the original thesis that it was persistently expensive and responded by sizing it down. The gate says size-down was the wrong response \u2014 if the price is wrong, own none of it.\n\nWHAT WOULD BRING IT BACK\nA materially lower price, a genuine step-up in forward estimates, or consensus\ntargets moving up enough to restore 15%+ implied upside. The business quality\nwas never the question \u2014 the price was. I will re-run this name through the gate\nevery monthly cycle, and if it clears, I will buy it and say so.\n","etn":"ETN \u2014 Eaton\nSTATUS: **REJECTED BY THE VALUATION GATE (IPS 3a)** on 2026-08-14. NOT OWNED.\n\nThis name was in my first roster. The client asked whether the good news was\nalready priced in. It was. The order was cancelled before any money moved.\n\n  Price               $453.33\n  Forward P/E         30.72\n  Implied upside      +4.1%   (floor is +15%)\n  Growth-adjusted     n/a (EPS -1.2%)   (limit is 2.0)\n\nWHY IT FAILED\nWorst implied upside on the entire desk: 4.11% to a 27-analyst consensus target. Trailing EPS is NEGATIVE year over year while the stock pays 30.72x forward. The data center demand story is completely correct and completely priced.\n\nWHAT WOULD BRING IT BACK\nA materially lower price, a genuine step-up in forward estimates, or consensus\ntargets moving up enough to restore 15%+ implied upside. The business quality\nwas never the question \u2014 the price was. I will re-run this name through the gate\nevery monthly cycle, and if it clears, I will buy it and say so.\n","gev":"GEV \u2014 GE Vernova\nSTATUS: **REJECTED BY THE VALUATION GATE (IPS 3a)** on 2026-08-14. NOT OWNED.\n\nThis name was in my first roster. The client asked whether the good news was\nalready priced in. It was. The order was cancelled before any money moved.\n\n  Price               $1,063.25\n  Forward P/E         49.31 forward vs 30.03 trailing\n  Implied upside      +16.5%   (floor is +15%)\n  Growth-adjusted     3.79   (limit is 2.0)\n\nWHY IT FAILED\nThe $176B backlog is real, verified, and entirely in the price. Forward P/E sits ABOVE trailing, meaning consensus expects earnings to FALL \u2014 trailing net income was up 724% y/y, which is not repeatable. Lowest revenue growth on the desk (+13%) at the highest forward multiple on the desk. An independent DCF puts pure fair value at $295-491; the blended base case is $1,019 against a $1,063 price. Adjusted EPS missed consensus by ~19% last quarter DESPITE a revenue beat \u2014 backlog-to-earnings conversion is exactly the weak point. Wind orders -40% y/y.\n\nWHAT WOULD BRING IT BACK\nA materially lower price, a genuine step-up in forward estimates, or consensus\ntargets moving up enough to restore 15%+ implied upside. The business quality\nwas never the question \u2014 the price was. I will re-run this name through the gate\nevery monthly cycle, and if it clears, I will buy it and say so.\n","googl":"GOOGL \u2014 Alphabet\nBook: Core \u00b7 Opening weight 7.0% \u00b7 Horizon multi-year\n\nWHY WE OWN IT\nAlphabet is the only company that owns the full stack \u2014 its own silicon (TPU),\nits own data centers, its own models, and a search/advertising business that\nprints the cash to fund all of it. In a market paying enormous multiples for\nsingle links in the AI chain, owning the whole chain at a lower multiple is the\nbetter trade.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  Alphabet is a hyperscaler contributing to the ~$840B 2026 capex figure.\n  VERIFIED  Axios, 5 Aug 2026.\n\n  CLAIM  Google's TPU program is a credible custom-silicon alternative to\n  merchant GPUs.\n  PARTIALLY CONFIRMED  Consistent with the custom-ASIC trend confirmed through\n  Broadcom's business, but I did not verify TPU deployment scale in a primary\n  filing this session.\n\n  CLAIM  Alphabet is Cramer's trust's largest technology position.\n  PARTIALLY CONFIRMED  It is a holding as of 30 June 2026; the source does NOT\n  disclose position weights, so I cannot confirm the ranking. Flagged rather\n  than repeated.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Search revenue decelerating as AI assistants displace query volume\n  \u00b7 An adverse antitrust remedy that structurally separates the business\n","jpm":"JPM \u2014 JPMorgan Chase\nSTATUS: **REJECTED BY THE VALUATION GATE (IPS 3a)** on 2026-08-14. NOT OWNED.\n\nThis name was in my first roster. The client asked whether the good news was\nalready priced in. It was. The order was cancelled before any money moved.\n\n  Price               $362.84\n  Forward P/E         15.03\n  Implied upside      +3.2%   (floor is +15%)\n  Growth-adjusted     0.77   (limit is 2.0)\n\nWHY IT FAILED\nThe cheapest multiple of anything rejected, and still rejected. 15.03x forward with a 0.77 growth-adjusted figure looks like value until you see 3.23% implied upside. A low multiple is not an opportunity when the entire street already agrees the stock is worth roughly what it costs.\n\nWHAT WOULD BRING IT BACK\nA materially lower price, a genuine step-up in forward estimates, or consensus\ntargets moving up enough to restore 15%+ implied upside. The business quality\nwas never the question \u2014 the price was. I will re-run this name through the gate\nevery monthly cycle, and if it clears, I will buy it and say so.\n","lin":"LIN \u2014 Linde\nSTATUS: **REJECTED BY THE VALUATION GATE (IPS 3a)** on 2026-08-14. NOT OWNED.\n\nThis name was in my first roster. The client asked whether the good news was\nalready priced in. It was. The order was cancelled before any money moved.\n\n  Price               $482.74\n  Forward P/E         25.82\n  Implied upside      +13.3%   (floor is +15%)\n  Growth-adjusted     2.53   (limit is 2.0)\n\nWHY IT FAILED\nA genuinely wonderful business at a full price. 25.82x forward against 10.2% EPS growth and 3.0% revenue growth. Quality is not a valuation argument.\n\nWHAT WOULD BRING IT BACK\nA materially lower price, a genuine step-up in forward estimates, or consensus\ntargets moving up enough to restore 15%+ implied upside. The business quality\nwas never the question \u2014 the price was. I will re-run this name through the gate\nevery monthly cycle, and if it clears, I will buy it and say so.\n","meta":"META \u2014 Meta Platforms\nBook: Core \u00b7 Opening weight 8.0% \u00b7 Horizon multi-year\nNEW POSITION \u2014 replaced names the valuation gate rejected.\n\nWHY WE OWN IT\nThis is the strongest valuation pass in the Core book, and it is not close.\n\nVALUATION\n  Price $589.85 \u00b7 Market cap $1.50T\n  Trailing P/E 22.42 \u00b7 Forward P/E 18.58  \u2190 forward BELOW trailing\n  Revenue +27.7% y/y\n  Consensus target $754.14 = +27.9% upside, 62 analysts, Strong Buy\n  Growth-adjusted multiple 0.67\n\nForward P/E below trailing means consensus expects earnings to RISE \u2014 the exact\nopposite of the GE Vernova signature that got that name rejected. An 18.58x\nmultiple on 27.7% revenue growth is the cheapest growth-adjusted number\navailable in a large-cap outside the semiconductor complex.\n\n  CLAIM  Revenue +27.7% TTM, net income -4.8%.\n  VERIFIED  stockanalysis.com, 14 Aug 2026. The earnings decline against rising\n  revenue is AI infrastructure spending hitting the P&L. That is the thing the\n  market is discounting, and it is also the thing I am willing to pay for.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 AI capex rising without a matching revenue return \u2014 capex without payback\n    is just cost\n  \u00b7 Adverse outcomes in the youth-harm litigation\n  \u00b7 Engagement declining in core apps\n\nRISK I AM ACCEPTING KNOWINGLY\nLitigation risk here is genuine and unquantifiable by me.\n","msft":"MSFT \u2014 Microsoft\nBook: Core \u00b7 Opening weight 7.8% \u00b7 Horizon multi-year\n\nWHY WE OWN IT\nThe core sleeve needs positions that compound through cycles without requiring\nme to be clever. Microsoft is the highest-quality way to own AI monetization\ninside a business with enterprise software economics underneath it, so the AI\nthesis being early or wrong costs far less here than it would in a pure play.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  Microsoft is among the hyperscalers whose 2026 capex guidance drove\n  aggregate expectations to ~$840B from $487B in February.\n  VERIFIED  Axios, 5 Aug 2026 (aggregate figure; Microsoft named among the\n  hyperscalers driving it).\n\n  CLAIM  Microsoft is a holding in Cramer's Charitable Trust.\n  VERIFIED  Holdings as of 30 June 2026. Noted for benchmark context only.\n\nNOTE ON VALUATION\nThe S&P 500 is at record highs (7,736.52 close, Aug 2026) with an active public\ndebate about AI-capex-driven overvaluation. I am not claiming this is cheap.\nI am claiming it is durable, which is a different and more defensible claim.\n","mu":"MU \u2014 Micron Technology\nBook: AI Trade \u00b7 Opening weight 10.0% \u00b7 Horizon 12+ months\nNEW POSITION \u2014 the memory leg this book was missing.\n\nWHY WE OWN IT\nInference is a memory-bound problem, not a FLOPS-bound one. Every argument in\nthis book about the rotation from training to inference implies memory demand,\nand until now the book had no memory exposure at all. That was a hole.\n\nMicron is also, by a wide margin, the cheapest thing on this desk.\n\nVALUATION  (the reason this is a large position)\n  Price $971.66 \u00b7 Market cap $1.10T\n  Trailing P/E 21.43 \u00b7 FORWARD P/E 6.61\n  Revenue +167% y/y \u00b7 EPS +705.7% y/y\n  Consensus target $1,501.98 = +54.6% upside, 46 analysts, Strong Buy\n  Growth-adjusted multiple 0.04 vs the 2.0 limit\n\nA 6.61x forward multiple on a company growing revenue 167% is not a rounding\nerror, it is a statement. The market is saying: these are peak-cycle earnings\nand they will collapse, so we refuse to capitalize them. That is the memory\ndiscount, and historically the market has often been right to apply it.\n\nTHE ACTUAL BET, STATED HONESTLY\nI am betting this cycle is structurally different, for one specific reason:\nHBM for AI accelerators is contracted years forward, not sold spot like\ncommodity DRAM. Contracted capacity does not behave like a commodity glut.\n\n  CLAIM  The memory shortage may persist past 2030.\n  PARTIALLY CONFIRMED  Attributed to SK Hynix via secondary reporting. It is a\n  competitor's forecast, not a fact, and forecasts from people who benefit from\n  scarcity deserve discounting. Directional support only.\n\n  CLAIM  Revenue +167% y/y, forward P/E 6.61, target $1,501.98.\n  VERIFIED  stockanalysis.com, 14 Aug 2026.\n\nWHAT WOULD MAKE ME WRONG \u2014 and this is a real risk, not a formality\n  \u00b7 The market is simply right: HBM capacity floods in, pricing breaks, and the\n    6.61x forward multiple turns out to be 6.61x on earnings that halve\n  \u00b7 DRAM contract pricing rolling over\n  \u00b7 Any hyperscaler cutting memory procurement guidance\n\nIf the multiple is a trap, it is a trap I walked into knowingly. A cheap\ncyclical at the top of its cycle is the oldest mistake in equities. I am sizing\nthis at 10% rather than the 12% cap for exactly that reason.\n","nvda":"NVDA \u2014 Nvidia\nBook: AI Trade \u00b7 Opening weight 10.5% \u00b7 Horizon 12+ months\n\nWHY WE OWN IT\nYou do not get to be underweight the toll booth while arguing the road is being\nwidened. Nvidia is deliberately sized BELOW AMD here despite being the larger\nand safer company, because the incremental surprise is more likely to come from\nthe challenger than the incumbent, and because a portfolio called \"the AI trade\"\nthat is mostly Nvidia is really just a single-stock bet wearing a costume.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  Nvidia is extending from training into inference silicon, including\n  Groq-derived LPU technology with embedded SRAM for the decode phase.\n  PARTIALLY CONFIRMED  Reported by Motley Fool (Aug 2026) and consistent with\n  the broader inference narrative. I did NOT verify the acquisition terms in a\n  filing. Supporting color only.\n\n  CLAIM  Hyperscaler 2026 capex expectations run near $840B, up from $487B in\n  early February 2026.\n  VERIFIED  Axios, 5 Aug 2026, citing tracked hyperscaler guidance. This is the\n  demand curve underneath the whole book, and it is still revising upward.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Hyperscaler capex guidance revised DOWN \u2014 the cleanest single tell\n  \u00b7 Custom ASICs (Broadcom/Google TPU) taking visible inference share\n  \u00b7 Gross margin compression signaling lost pricing power\n\nRISK I AM ACCEPTING KNOWINGLY\nThis is a consensus long at a record-high market. I am not being paid for\noriginality here; I am being paid not to be cute about the largest and most\nobvious beneficiary of the largest capex cycle in the sector's history.\n","tsm":"TSM \u2014 Taiwan Semiconductor\nBook: AI Trade \u00b7 Opening weight 9.0% \u00b7 Horizon 12+ months\n\nWHY WE OWN IT\nEvery name in this book \u2014 Nvidia, AMD, Broadcom, Cerebras \u2014 ultimately queues\nat the same foundry. Owning TSM is owning the bottleneck rather than guessing\nwhich customer wins the argument above it. In a book about a compute buildout,\nthis is the position with the least dependence on picking the right architecture.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  TSMC manufactures leading-edge silicon for essentially all major AI\n  accelerator designers.\n  VERIFIED  Structural industry fact, confirmed across company disclosures and\n  the customer relationships named in AMD, Nvidia and Broadcom reporting.\n\n  CLAIM  The 2026 semiconductor cycle is being driven by AI infrastructure.\n  PARTIALLY CONFIRMED  Deloitte 2026 semiconductor outlook and multiple sources\n  agree directionally. Used as context, not as a specific number.\n\nRISK I AM ACCEPTING KNOWINGLY\nTaiwan geopolitical risk is real, unhedgeable, and not priced by any model I\nhave. It is the explicit reason this is 9% and not 15%. If that risk is\nunacceptable to you, say so and I will exit \u2014 it is a values question, not an\nanalytical one.\n","unh":"UNH \u2014 UnitedHealth Group\nBook: Core \u00b7 Opening weight 6.5% \u00b7 Horizon multi-year\nNEW POSITION \u2014 the non-technology ballast.\n\nWHY WE OWN IT\nAfter the valuation gate finished, the Core book was four mega-cap technology\nnames and a healthcare ETF. That is not a diversified portfolio, it is an AI bet\nwith extra steps \u2014 and it would have been highly correlated with the AI book.\nUNH is the deliberate correction.\n\nVALUATION \u2014 a documented edge case\n  Price $401.73 \u00b7 Market cap $360.59B\n  Trailing P/E 25.86 \u00b7 Forward P/E 18.88  \u2190 forward BELOW trailing\n  Trailing EPS $15.53, DOWN 32.8% y/y\n  Consensus target $475.23 = +18.3% upside, 27 analysts, Buy\n\nA naive growth-adjusted test would fail this: you cannot divide a multiple by\nnegative growth. But the trailing decline IS the opportunity \u2014 the multiple has\nalready de-rated for it. Forward P/E of 18.88 against trailing 25.86 implies\nroughly 37% forward earnings recovery, giving a growth-adjusted figure of 0.51.\n\nThat method is now written into IPS 3a and research/valuation.json, before the\nfact, precisely so it cannot be applied selectively to rescue names I like.\n\n  CLAIM  \"UnitedHealth blows past estimates, hikes earnings outlook as it reins\n  in costs.\"\n  PARTIALLY CONFIRMED  Reported via stockanalysis.com's news summary. The beat\n  and raise is consistent with forward P/E sitting below trailing. I did NOT\n  read the primary release this session. Flagged for verification.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Medical loss ratio deteriorating again\n  \u00b7 Medicare Advantage rate or regulatory pressure\n  \u00b7 The recovery in forward estimates not materializing in the next two prints\n","vrt":"VRT \u2014 Vertiv Holdings\nBook: AI Trade \u00b7 Opening weight 5.5% \u00b7 Horizon 12 months\nNEW POSITION \u2014 thermal and power distribution inside the rack.\n\nWHY WE OWN IT\nRack densities are rising faster than air cooling can handle, which forces\nliquid cooling. Vertiv sells the thermal management and power distribution that\nsits between the utility feed and the GPU. It is the least glamorous link in the\nchain and one of the hardest to design around.\n\nVALUATION \u2014 the weakest pass in the book\n  Price $293.84 \u00b7 Market cap $113.12B\n  Trailing P/E 66.50 \u00b7 Forward P/E 37.69\n  Revenue +26.2% y/y \u00b7 EPS +168.8% (2025)\n  Consensus target $338.15 = +15.08% upside, 28 analysts, Strong Buy\n  Growth-adjusted multiple 1.44 vs the 2.0 limit\n\nIt clears the 15% upside floor by 0.08 percentage points. That is a pass, and\nit is a pass I am not proud of. Hence the smallest position in the book.\n\n  CLAIM  Recent results were mixed; management called the issues \"a temporary\n  issue\" relating to project timing and supply chain.\n  VERIFIED as a quote. Treated with the skepticism that phrase deserves \u2014 it is\n  what every management team says, and it is right maybe half the time.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 \"Temporary\" project-timing issues recurring next quarter\n  \u00b7 Multiple compression toward the sector \u2014 at 37.69x forward there is a\n    long way to fall\n  \u00b7 Hyperscalers standardizing on in-house thermal designs\n","xlv":"XLV \u2014 Health Care Select Sector SPDR\nBook: Core \u00b7 Opening weight 5.4% \u00b7 Horizon multi-year\n\nWHY WE OWN IT\nTwo reasons, and I want to be straight about the second one.\n\nFirst: healthcare is the sector where I have the least edge. Drug pipelines and\nreimbursement policy are genuinely hard, and single-name healthcare risk is\nbrutal \u2014 one FDA decision can halve a stock. An ETF buys the sector exposure\nwithout pretending I can pick within it. Using an index fund where you lack an\nedge is discipline, not laziness.\n\nSecond: sector leadership rotated toward healthcare in 2026 while technology\nconsolidated.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  Healthcare led US sector performance in August 2026.\n  PARTIALLY CONFIRMED  Reported by Algo Lab's August 2026 sector focus. A\n  single secondary source; I did not corroborate it independently. This is\n  supporting context, not the reason to own it. The first reason stands alone.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Adverse drug pricing legislation\n  \u00b7 If I develop genuine single-name conviction here, this converts to stocks\n"},"watchlist":{"_purpose":"Emerging theme radar. The client's instruction: space data centers was an EXAMPLE of a class - themes with low absolute chatter and rising interest, where the upside is caught early. This file tracks those themes between cycles, so the hunt is systematic rather than whatever I happened to think of that week. Reviewed every three weeks. IPS 3b.","_scoring":{"chatter":"LOW / MEDIUM / HIGH - absolute mainstream coverage. LOW is what we want.","trajectory":"RISING / FLAT / FALLING - direction of interest. RISING + LOW is the target quadrant.","capital_committed":"Has real money moved? Funding rounds, capex line items, regulatory filings. Money moves before articles do.","vehicle_quality":"GOOD / DILUTED / NONE - is there a public company whose economics actually concentrate the theme? This is the test most themes fail.","time_to_pnl":"When does this hit an income statement?","status":"WATCHING / ACTIONABLE / BOUGHT / REJECTED"},"_last_review":"2026-09-13","_next_review":"2026-10-04","_review_cadence":"Every three weeks. Scheduled task fires on the 1st and 22nd of each month.","_this_cycle":"Run manually in session on 2026-09-13. The four scheduled runs between 2026-08-31 and 2026-09-07 all reported SUCCESS but committed nothing to this repo, so this file had not changed since the 2026-08-15 upload. That is why the Radar tab appeared frozen. Cause not yet proven - the effect is certain. This cycle answered the longest-standing open question on the list.","themes":[{"id":"co-packaged-optics","name":"Co-packaged optics / silicon photonics","thesis":"The AI bottleneck is moving from the chip to the interconnect between chips. Copper is running out of headroom on power and latency at cluster scale, forcing optics directly into the package. Broadcom's framing is the tell: 'our switches and XPUs are going to be lower power with optics than with copper' - optics justify themselves on efficiency, not just bandwidth.","chatter":"MEDIUM","trajectory":"RISING","capital_committed":"NVIDIA invested $2B in Lumentum as part of a reported $4B optical strategy. The Open Compute Interconnect standard was founded by AMD, Broadcom, NVIDIA, Meta, Microsoft and OpenAI together. Samsung and ST are bringing silicon photonics to 300mm wafer platforms.","vehicle_quality":"GOOD","time_to_pnl":"Revenue now, inflection at 2028 volume production for CPO integration; 2029 for full GPU-HBM package integration.","status":"BOUGHT","vehicles":{"COHR":"BOUGHT. Passed the gate at entry: 35.20x fwd, +26.1% upside, forward BELOW trailing. Was trading 26% below its 52-week high, so not chasing a top.","ALAB":"BOUGHT. Passed: 57.31x fwd but revenue +98.5% gives 0.58 growth-adjusted. Q3 guided $540-560M vs $392.4M actual.","LITE":"REJECTED - already ran. $111.20 to $926.14 across the 52-week range, market cap +888% y/y. Negative trailing earnings. The theme is real; this vehicle is late. Being right about a theme and buying it at 8x is still losing.","MRVL/AVGO/NVDA":"Already held or adjacent exposure via AVGO and NVDA."},"note":"NOT RE-VERIFIED THIS CYCLE. The 2026-09-13 pass spent its budget on the transformer vehicle question and the financing risk monitor. Nothing here is known to have changed; equally, nothing here was rechecked. Treat the entry-date valuation figures above as stale - they were true at purchase, not necessarily now. Re-verify at the next cycle.","sources":["OFC 2026 conference coverage (SemiWiki, EE Times)","io-fund on NVIDIA's optical strategy"]},{"id":"transformer-goes-shortage","name":"Power transformers and grain-oriented electrical steel","thesis":"A real, well-documented hard constraint on the AI buildout: power transformer lead times went from ~50 weeks in 2021 to ~120 weeks by 2024 (Wood Mackenzie), large units run 80-210 weeks, prices are up 60-80% since Jan 2020, and only ~20% of US demand can be met domestically. It slows the PACE of the buildout and favours the supply-constrained names. CORRECTION 2026-08-14: I originally carried a '30-50% of 2026 capacity cancelled' bear claim here as a risk to this desk's own AI book. On verification that framing is substantially overstated - SemiAnalysis showed the underlying denominator is off by multiples, the shortfall sits in speculative announcements that were never real 2026 projects, and their own forecast moved ~1% in six months. Meanwhile hyperscaler capex was RAISED. Constraint: real. Demand threat: not supported. See the full note below.","chatter":"LOW","trajectory":"RISING","capital_committed":"Cleveland-Cliffs' Butler Works is the only domestic producer of grain-oriented electrical steel and the only domestic source of the high-permeability grade used in power transformers. Its $170M expansion does not arrive until 2028. VERIFIED 2026-09-13: Hammond Power Solutions reported Q2 2026 backlog up 96.9% year over year, which the company attributes primarily to data centre project orders.","vehicle_quality":"DILUTED","time_to_pnl":"Now, but buried inside larger businesses.","status":"WATCHING \u00b7 VEHICLE QUESTION ANSWERED","vehicles":{"CLF":"REJECTED. The perfect narrative and the wrong vehicle. Consensus target $11.80 against an $11.90 price = -0.8% DOWNSIDE, Hold rating from 13 analysts, and the company is lossmaking (-$876M net income, EPS -$1.60). The GOES monopoly is a rounding error inside $19.2B of commodity steel revenue that mostly serves autos. An under-covered theme is only investable if some vehicle's economics actually concentrate it.","HPS.A":"REJECTED ON VENUE, NOT ON THESIS. Hammond Power Solutions is the closest thing to a listed transformer pure-play and the numbers are strong: Q2 2026 revenue $324.8M, +44.7% y/y; year to date $589.6M, +38.5%; backlog +96.9% y/y on data centre orders. But it lists on the Toronto Stock Exchange as HPS.A and reaches US investors only as OTC ticker HMDPF. IPS 8 excludes OTC venues on liquidity grounds - the same rule that excluded BrainChip. Also worth noting even if the venue cleared: net earnings FELL to $9.4M from $13.4M and basic EPS to $0.79 from $1.12 despite revenue growing 45%. Volume is arriving faster than profit. A pure-play on a shortage is not automatically a pure-play on margin.","POWL":"NEW CANDIDATE 2026-09-13, needs the IPS 3a valuation gate before any buy. Powell Industries, NASDAQ listed, so it clears IPS 8 on venue where Hammond does not. Fiscal Q3 2026 (quarter ended 30 June 2026, company release 3 Aug 2026): new orders $934M, up 158% y/y from $362M; backlog $2.4B, up 69% y/y from $1.4B; revenue $312M, up only 9%; net income $52.2M, EPS $1.42, +8%; gross margin 30.6% versus 30.7%. Includes a single data centre order in excess of $400M. The orders-versus-revenue divergence is the point: +158% orders against +9% revenue means the commitment is already signed and the income statement has not seen it yet. That is the 'capital moves before articles do' profile this radar is built to find. CAVEAT, stated plainly: Powell makes switchgear and electrical distribution equipment, NOT transformers. It is a grid-equipment vehicle adjacent to this theme, not a pure-play on it. Do not let the convenience of a listed vehicle blur what it actually sells.","_todo":"ANSWERED 2026-09-13. The question 'is there a liquid US-listed pure-play on power transformers?' now has a real answer: no. Hammond is the pure-play and fails IPS 8 on venue. Powell is US-listed and liquid but sells switchgear, not transformers. The honest conclusion is that this theme has no clean US-listed pure-play, and pretending otherwise by stretching a definition would be the CLF mistake in a new costume. NEXT: run the IPS 3a valuation gate on POWL as a grid-equipment position on its own merits, not as a transformer proxy."},"note":"VERIFIED AND REVISED 2026-08-14. I initially flagged '30-50% of announced data center capacity may slip' as a risk to this desk's AI book, on the strength of one Medium post and a Forbes piece. That was below the evidence standard I apply to buying a stock, so it should not have been enough to argue against one. On checking:\n\nSOURCE OF THE CLAIM: Currence, an energy intelligence firm, tracking 777 announced AI factories >50MW. ~190GW announced since 2024; 16GW scheduled for 2026 operation; ~5GW under construction.\n\nTHE REBUTTAL (SemiAnalysis, the most credible source in this niche, published specifically to correct this): (1) the 5GW denominator is 'off by multiples' - their satellite imagery shows the top TWO hyperscalers alone exceed 5GW under construction; (2) the cancellations cluster in early-stage speculative announcements lacking site control, financing or interconnection - projects never realistic for 2026 anyway; (3) SemiAnalysis's own year-end 2026 North America hyperscaler self-build forecast moved only ~1% over six months, colocation under 5%; (4) the meme traces to an April 2026 Bloomberg piece about Chinese electrical parts, sharpened into clickbait downstream.\n\nALSO: 'delayed' is not 'cancelled'. Currence itself measures timeline slippage, not abandonment. Delays push revenue right; they do not destroy it.\n\nSTILL CIRCULATING, 2026-09-13. A search of current coverage this cycle returned multiple pieces still running the '50% of 2026 AI capacity at risk' framing, now propagated through low-quality SEO content rather than any new evidence. Nothing in this cycle's search surfaced a fresh primary source supporting it. Treat renewed sightings of this claim as an echo of the April 2026 original, not as confirmation. The fact that a claim keeps reappearing is not evidence that it is true - repetition is not corroboration, and this is exactly the trap IPS 4 exists to prevent.\n\nCONCLUSION: the transformer constraint is real and well documented. It slows the PACE of buildout. It does not undermine the demand thesis.\n\nWHAT I GOT WRONG: I amplified a thinly-sourced bear claim without checking it, in the same session I wrote a rule requiring primary-source verification. The client asked me to explain it, which is what surfaced the error.","sources":["Powell Industries Q3 FY2026 results release, 3 August 2026 (company issued)","Hammond Power Solutions Q2 2026 results release, 30 July 2026 (company issued)","Wood Mackenzie on transformer lead times","SemiAnalysis rebuttal of the capacity-cancellation claim"],"tripwires":["GE Vernova order growth decelerating (quarterly, public)","Any hyperscaler CUTTING capex guidance - none have; all raised","Transformer lead times extending materially beyond ~120-128 weeks","SemiAnalysis revising its self-build forecast down by more than 5%","Powell orders reverting toward revenue - the +158% versus +9% gap closing from the orders side rather than the revenue side would kill the thesis","Hammond's margin compression spreading to US-listed peers - volume without profit is a warning about the whole theme, not just one company"]},{"id":"electrical-balance-of-plant","name":"Switchgear and electrical distribution equipment","thesis":"NEW 2026-09-13. Separated out from the transformer theme because the vehicle situation is materially different and better. Transformers get the coverage, but a data centre also needs switchgear, breakers and distribution gear, and those order books are inflecting harder than the revenue lines that analysts model. The distinguishing feature is that a credible US-listed vehicle exists here, which is precisely what the transformer theme lacks.","chatter":"LOW","trajectory":"RISING","capital_committed":"VERIFIED FROM COMPANY RELEASE 2026-09-13. Powell Industries fiscal Q3 2026 (quarter ended 30 June 2026): new orders $934M against $362M a year earlier, +158%. Backlog $2.4B against $1.4B, +69%. Within that, one data centre order above $400M - a single order worth more than the company's entire quarterly revenue of $312M. Management also cited LNG (~$60M) and petrochemical (~$75M) awards, so the order book is not a single-customer story.","vehicle_quality":"GOOD","time_to_pnl":"Backlog converts over roughly 4-8 quarters. Revenue grew only 9% while orders grew 158%, so the income-statement effect is ahead, not behind. That gap is the opportunity and also the risk.","status":"WATCHING \u00b7 GATE NOT YET RUN","vehicles":{"POWL":"Powell Industries, NASDAQ. Clears IPS 8 on venue and liquidity. Q3 FY2026: revenue $312M (+9%), net income $52.2M, EPS $1.42 (+8%), gross margin 30.6% versus 30.7% - margins held flat while volume scaled, which is the opposite of Hammond's problem. NOT YET BOUGHT. No position may be taken until IPS 3a is run and recorded in research/valuation.json: consensus upside, forward P/E, and growth-adjusted multiple. The GEV lesson applies directly here - a large verified backlog is not itself an investment case if the market has already priced it. The question is not 'is the backlog real' (it is, it is in a company filing) but 'is the backlog already in the price'.","_todo":"Run IPS 3a on POWL. If consensus upside is under 15% or the growth-adjusted multiple exceeds 2.0, this is a WATCHING theme with a known vehicle and no trade - which is a perfectly good outcome and should be logged as such rather than rationalised around."},"note":"Honest statement of what is NOT established. I have verified the order book from the company's own release. I have NOT run the valuation gate, checked where the stock trades against its 52-week range, or confirmed that the data-centre order mix is durable rather than a one-off lumpy award. Powell is a project-based business and lumpy orders are normal in project-based businesses; a single quarter of +158% is a signal to investigate, not a conclusion. Next cycle should close those three gaps before any buy is contemplated.","sources":["Powell Industries Q3 FY2026 results release, 3 August 2026 (company issued)"]},{"id":"orbital-compute","name":"Space / orbital data centers","thesis":"Terrestrial data centers are constrained by land, power and water. Orbital compute is constrained by launch cost, which falls on a technology curve rather than a resource curve.","chatter":"LOW","trajectory":"RISING","capital_committed":"Blue Origin filed for 51,600 data center satellites. Starcloud reached a $1.1B valuation. Meta signed a space-based power agreement with Overview Energy. Google's Project Suncatcher completed radiation testing with two prototypes planned for early 2027. SpaceX targets Starmind AI1 as early as 2027 using NVIDIA Vera CPUs and Rubin GPUs.","vehicle_quality":"DILUTED","time_to_pnl":"2027 prototypes; economic parity projected 2038-2040.","status":"WATCHING","vehicles":{"NVDA":"HELD. Disclosed $21B stake in SpaceX plus the Starmind AI1 compute partnership. The cleanest exposure, and free inside a position owned for other reasons.","GOOGL":"HELD. Project Suncatcher.","RKLB":"MOONSHOT-PENDING. 2 of 4 Moonshot criteria verified. Trades 47% below its 52-week high, so not disqualified for having run.","RDW / PL":"Unscreened.","_todo":"CLIENT DIRECTION 2026-08-14, priority order. PRIMARY: public companies holding disclosed stakes in private space/AI-infrastructure leaders. NVDA's $21B in SpaceX is the model. SECONDARY: (a) radiation-hardened semiconductors - few qualified suppliers, Intel Starfire and Microchip as starting points; (b) launch capacity - RKLB the main listed pure-play, open question whether launch is a constraint or a commodity; (c) thermal/power/structures - cooling in vacuum is unsolved, Redwire and satellite component makers. The client noted these are unfamiliar, so any position here needs the thesis written for someone starting from zero."},"note":"Honest economics: orbital compute currently costs ~4x terrestrial ($8.64 vs $2.37 per GPU-hour). This is 2027+ optionality, not a 2026 revenue story. Do not let a good narrative become a valuation argument.\n\nEDGE WARNING 2026-09-13. The PRIMARY open question above - find listed companies holding stakes in private AI and space leaders - was a genuinely under-covered angle when it was written in August. It is not any more. A search this cycle returned page after page of 'SpaceX / OpenAI / Anthropic 2026 IPO watchlist' content aimed at retail readers. When an angle becomes an SEO category, the informational edge in it is gone even if the underlying facts are unchanged. This does not make NVDA's SpaceX stake less real; it means finding that stake is no longer differentiated insight. Downgrade the priority of this question and stop spending cycles rediscovering what is now on the front page. The LITE lesson generalises: being right about something everyone already knows is not an edge.","sources":["InvestorPlace on Starmind AI1","Fierce Network on space data centers","GeekWire on Starcloud"]},{"id":"physical-ai","name":"Physical AI / robotics / edge inference","thesis":"Inference moving off the data center and into machines that act on the world. Distinct from the buildout trade because the economics are unit-volume driven rather than capex driven.","chatter":"MEDIUM","trajectory":"RISING","capital_committed":"Being named as a distinct investment theme in Asian markets; hardware startup funding concentrating on edge compute and robotics infrastructure.","vehicle_quality":"UNSCREENED","time_to_pnl":"Unclear - the main open question.","status":"WATCHING","vehicles":{"_todo":"No credible screen run yet. Neuromorphic pure-plays like BrainChip trade OTC and are excluded by IPS 8 liquidity and venue rules. Still unscreened as of 2026-09-13 - carried, not progressed."},"sources":["Seoul Economic Daily","edge AI funding analyses"]},{"id":"ai-capex-financing","name":"How the AI buildout is actually being financed","thesis":"Capex is growing faster than the revenue it supports. That gap has to be financed somewhere - vendor financing, private credit, SPVs, debt. Follow the money and you find both a risk indicator for the whole desk and possibly a beneficiary. This is the theme most likely to matter to this desk as a WARNING rather than an opportunity.","chatter":"MEDIUM","trajectory":"RISING","capital_committed":"UPDATED AND VERIFIED 2026-09-13 from J.P. Morgan's published capital-markets analysis. Five largest US hyperscalers now estimated at $697B of 2026 capex, raised by $173B since the start of this year. Project Stargate: up to $500B over four years, with $9.6B already drawn across two J.P. Morgan construction loans for the Abilene, Texas campus alone. Individual deals show the leverage directly: Hut 8's Beacon Point financing in June 2026 raised $4.25B of senior secured notes at a 95% loan-to-cost ratio; CoreWeave in April 2026 raised $5.25B, split $1.75B senior unsecured and $3.5B convertible.","vehicle_quality":"NONE - this is a risk monitor, not a position","time_to_pnl":"n/a - rate sensitivity, not revenue.","status":"WATCHING \u00b7 HIGHEST-PRIORITY RISK MONITOR","note":"WHY THIS MATTERS TO THIS DESK SPECIFICALLY. The AI Trade book is roughly nine names deep in the buildout. If the buildout is increasingly debt-financed, then every position in that book quietly inherits interest-rate sensitivity that none of their individual theses mention. That is a correlated risk hiding inside what looks like a diversified book.\n\nThe single most informative number found this cycle is Hut 8's 95% loan-to-cost. Financing a data centre with 95 cents of debt per dollar of cost leaves almost no equity cushion; it only works while the asset's contracted cash flows hold and refinancing stays available. It is not evidence of a bubble on its own - project finance often runs high leverage against contracted revenue - but it is the kind of structure that transmits a rate move or a single anchor-tenant default straight through to the builder.\n\nWHAT IS NOT ESTABLISHED: J.P. Morgan's published piece does not give an explicit debt-versus-cash-flow percentage for hyperscaler capex overall, and I did not find one this cycle. So the central question - what share of the $697B is debt - remains genuinely unanswered rather than estimated. I am not going to infer a percentage from three deal headlines; three large debt deals do not establish a system-wide ratio, and pretending they do would be the same error as the capacity-cancellation claim.\n\nNOTE ON CAPEX FIGURES: this file previously carried $840B and $725B for 2026 hyperscaler capex from earlier sources. J.P. Morgan's $697B covers the five largest US hyperscalers specifically. Different baskets, so these are not necessarily contradictory - but do not stack or average them, and do not quote a single 'the' capex number as though the definition were settled.","sources":["J.P. Morgan, Financing AI infrastructure and U.S. data centers (capital markets insights)"],"tripwires":["Loan-to-cost ratios on new data centre financings rising above the mid-90s","A major anchor tenant failing to take contracted capacity","Spreads widening materially on AI-infrastructure paper","Any hyperscaler funding capex from debt that previously funded it from operating cash flow"]}],"_open_questions":["RESOLVED 2026-09-13: is there a liquid US-listed pure-play on power transformers? No. Hammond Power Solutions is the pure-play and is TSX/OTC, which IPS 8 excludes. Powell Industries is US-listed and liquid but sells switchgear, not transformers. Recorded rather than deleted, because a closed question is a result.","NEW, highest value: does POWL clear IPS 3a? Consensus upside, forward P/E, growth-adjusted multiple. A verified backlog that is already in the price is the GEV situation over again.","NEW: is Powell's data-centre order mix durable or a single lumpy award? One quarter at +158% orders is a reason to look, not a conclusion.","NEW: is Hammond's margin compression - revenue +45% but EPS down - specific to Hammond, or is it what happens to everyone selling into this shortage? If the latter, the whole transformer theme is a revenue story and not a profit story.","STILL OPEN: what is the actual debt share of 2026 hyperscaler capex? J.P. Morgan's published work does not state one. Determines how rate-sensitive the AI book really is.","DOWNGRADED: which public companies hold disclosed stakes in private space/AI-infra leaders? Now a mainstream retail-facing SEO category. The facts are unchanged; the edge is gone.","Which OFC 2026 suppliers are NOT yet in consensus models? The laser-supply tier has been called mispriced. Not progressed this cycle.","Does anything in physical AI clear IPS 8 on liquidity and venue? Not progressed this cycle."],"_lesson_log":[{"date":"2026-08-14","lesson":"Applied the verification standard asymmetrically: demanded primary sources before BUYING, accepted a Medium post before flagging a RISK. Bear claims need the same evidence bar as bull claims. A comfortable-sounding caution is still a claim.","cost":"None - caught before it changed any position.","fix":"IPS 4 now applies explicitly to risk claims as well as thesis claims."},{"date":"2026-09-13","lesson":"Four scheduled research runs between 2026-08-31 and 2026-09-07 reported SUCCESS and committed nothing. Roughly four hours of model time produced no durable output, and nobody noticed for two weeks because the only signal of a working system was a push notification that only fires on trades. A job that cannot write is indistinguishable from a job that found nothing, and 'no news' was read as 'nothing happening' when it actually meant 'nothing is reaching you'.","cost":"Two weeks of a stale radar and four wasted runs. No position was harmed - the daily marking and risk rules run in GitHub Actions and never stopped.","fix":"Scheduled runs must verify their own commit landed rather than trusting a clean exit, and must report the failure loudly if it did not. A silent success is the most dangerous possible outcome, because it looks exactly like a quiet market."},{"date":"2026-09-13","lesson":"The '50% of 2026 AI capacity at risk' claim, debunked here on 2026-08-14, resurfaced repeatedly in this cycle's search results - now carried by low-quality SEO content rather than any new evidence. The temptation to treat its reappearance as corroboration is real.","cost":"None - recognised on sight because the August correction was written down in this file.","fix":"Repetition is not corroboration. Before treating a re-encountered claim as confirmed, check whether it traces to a NEW primary source or to the same original. This is the practical argument for keeping the lesson log: it is what made the claim recognisable the second time."}]},"moonshot_c function series(p){
  let nav=p.nav_history||[];
  if(nav.length<2) return null;
  const cut={ "1M":30, "3M":90, "6M":180 }[range];
  if(cut){ const d=new Date(); d.setDate(d.getDate()-cut);
    const iso=d.toISOString().slice(0,10);
    const f=nav.filter(r=>r.date>=iso); if(f.length>=2) nav=f; }
  const base=nav[0].equity||p.starting_cash;
  const labels=nav.map(r=>r.date), eq=nav.map(r=>r.equity);
  const port=eq.map(v=>(v/base)*100);
  const mk=tk=>{const c=(DATA.benchmarks||{})[tk]||{};let b0=null,last=null;
    const o=labels.map(d=>{if(c[d]!=null)last=c[d];if(last==null)return null;
      if(b0==null)b0=last;return (last/b0)*100});
    return o.some(v=>v!=null)?o:null};
  return {labels,port,eq,base,bench:mk(p.benchmark),bn:p.benchmark};
}

function drawChart(p){
  const el=document.getElementById("eq"); if(!el) return;
  if(chart){chart.destroy();chart=null}
  const s=series(p); if(!s) return;
  const col=cv(SV[p.key]), bc=cv("--s-bench"), grid=cv("--grid"), ink=cv("--ink-3");
  const g=el.getContext("2d").createLinearGradient(0,0,0,el.height||300);
  g.addColorStop(0,col+"38"); g.addColorStop(1,col+"03");
  const ds=[{label:p.name,data:s.port,borderColor:col,backgroundColor:g,borderWidth:2,
    pointRadius:0,pointHoverRadius:4,pointHoverBackgroundColor:col,
    pointHoverBorderColor:cv("--bg"),pointHoverBorderWidth:2,tension:.16,fill:true,order:1}];
  if(s.bench)ds.push({label:s.bn,data:s.bench,borderColor:bc,borderWidth:1.5,borderDash:[4,4],
    pointRadius:0,pointHoverRadius:4,tension:.16,fill:false,order:2,spanGaps:true});
  chart=new Chart(el,{type:"line",data:{labels:s.labels,datasets:ds},options:{
    responsive:true,maintainAspectRatio:false,
    interaction:{mode:"index",intersect:false},
    plugins:{legend:{display:false},tooltip:{
      backgroundColor:cv("--surface-1"),titleColor:cv("--ink"),bodyColor:cv("--ink-2"),
      borderColor:cv("--border-2"),borderWidth:1,padding:11,cornerRadius:9,
      displayColors:true,boxWidth:7,boxHeight:7,usePointStyle:true,
      titleFont:{size:11},bodyFont:{size:12,family:"ui-monospace,Menlo,monospace"},
      callbacks:{
        title:it=>new Date(it[0].label+"T12:00:00")
          .toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"}),
        label:c=>{const d=(c.parsed.y-100);
          if(c.datasetIndex===0){const v=s.eq[c.dataIndex];
            return "  "+c.dataset.label+"   "+money(v)+"   "+(d>=0?"+":"")+d.toFixed(2)+"%"}
          return "  "+c.dataset.label+"   "+(d>=0?"+":"")+d.toFixed(2)+"%"}
      }}},
    scales:{x:{grid:{display:false},border:{color:grid},
        ticks:{color:ink,maxTicksLimit:5,font:{size:9.5},maxRotation:0}},

        ticks:{color:ink,font:{size:9.5},padding:6,
          callback:v=>((v-100)>=0?"+":"")+(v-100).toFixed(0)+"%"}}}
  }});
}
