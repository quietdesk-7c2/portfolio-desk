<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<title>Portfolio Desk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme: dark;
  --bg:#0a0a0b; --surface-1:#141416; --surface-2:#1c1c1f; --surface-3:#26262a;
  --border:#2a2a2e; --border-2:#3a3a40; --grid:#1f1f23;
  --ink:#f2f2f4; --ink-2:#a8a8b3; --ink-3:#6e6e7a;
  --good:#22c55e; --bad:#ef4444; --warn:#fab219;
  --s-core:#3987e5; --s-moon:#d95926; --s-ai:#199e70; --s-bench:#7a7a85;
  --r:12px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f6f6f4; --surface-1:#ffffff; --surface-2:#f0f0ee; --surface-3:#e6e6e3;
  --border:#e2e2de; --border-2:#cfcfc9; --grid:#eaeae7;
  --ink:#0b0b0b; --ink-2:#55555c; --ink-3:#8a8a92;
  --good:#0ca30c; --bad:#d03b3b;
  --s-core:#2a78d6; --s-moon:#eb6834; --s-ai:#1baf7a; --s-bench:#83827c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:14px 13px 60px}
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)} .dim{color:var(--ink-3)}
.lbl{font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px}
/* The header dot is a status light, not decoration. Grey by default: the page
   is static and honest about it. It only goes green, and only pulses, when
   live quotes actually came back. A light that is always green tells you
   nothing. */
.dotpulse{width:7px;height:7px;border-radius:50%;background:var(--ink-3);
  box-shadow:0 0 0 3px rgba(120,120,130,.12);transition:background .3s,box-shadow .3s}
.dotpulse.live{background:var(--good);box-shadow:0 0 0 3px rgba(34,197,94,.16);
  animation:pulse 2.4s ease-in-out infinite}
.dotpulse.partial{background:var(--warn);box-shadow:0 0 0 3px rgba(217,119,6,.16)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.dotpulse.live{animation:none}}
h1{font-size:14px;margin:0;letter-spacing:.02em;font-weight:650}
.stamp{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.stamp.live{color:var(--good)}
.tbtn{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);
  border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;font-weight:600}

/* hero */
.hero{background:linear-gradient(180deg,var(--surface-1),var(--bg));
  border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px}
.hero .big{font-size:clamp(30px,8vw,44px);font-weight:680;letter-spacing:-0.025em;line-height:1}
.deltas{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;align-items:baseline}
.delta{font-size:14px;font-weight:600}
.delta .lbl{display:block;margin-bottom:2px}
.strip{display:flex;gap:0;flex-wrap:wrap;margin-top:15px;padding-top:13px;
  border-top:1px solid var(--border)}
.strip>div{flex:1;min-width:88px;padding-right:12px}
.strip b{display:block;font-size:14px;font-weight:600;margin-top:3px}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:10px;
  margin-bottom:12px;overflow-x:auto}
.tab{flex:1;min-width:82px;border:0;background:transparent;color:var(--ink-3);
  padding:9px 8px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tab .dot{width:6px;height:6px;border-radius:50%;flex:none}
.tab[aria-selected="true"]{background:var(--surface-3);color:var(--ink)}

.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);
  padding:15px;margin-bottom:12px}
.card h2{font-size:12px;margin:0;font-weight:650;letter-spacing:.03em;text-transform:uppercase}
.note{font-size:11.5px;color:var(--ink-3);margin:5px 0 13px;line-height:1.5}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:11px;padding:11px 12px}
.tile .v{font-size:19px;font-weight:650;margin-top:4px;letter-spacing:-0.015em}
.tile .s{font-size:10.5px;color:var(--ink-3);margin-top:2px}

/* chart */
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ranges{display:flex;gap:3px;background:var(--surface-2);padding:2px;border-radius:7px}
.rbtn{border:0;background:transparent;color:var(--ink-3);font-size:10.5px;font-weight:600;
  padding:5px 9px;border-radius:5px;cursor:pointer;font-family:inherit}
.rbtn[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}
.chartbox{position:relative;height:250px;margin-top:12px}
@media(min-width:700px){.chartbox{height:320px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:13px;height:2.5px;border-radius:2px;margin-right:6px;vertical-align:3px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--s-bench) 0 4px,transparent 4px 8px)}

/* allocation */
.alloc{display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;font-size:11.5px}
.abar{height:13px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.abar span{display:block;height:100%;border-radius:3px}

/* holdings */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -15px;padding:0 15px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:right;font-weight:600;color:var(--ink-3);font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;padding:0 0 9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:10px 0 10px 10px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.tk{display:flex;align-items:center;gap:8px;font-weight:650}
.tk .sw{width:3px;height:16px;border-radius:2px;flex:none}
.pill{display:inline-block;font-size:8.5px;padding:2px 5px;border-radius:4px;margin-left:6px;
  font-weight:700;letter-spacing:.05em;vertical-align:1px;background:var(--surface-3);color:var(--ink-2)}
.pill.hm{background:rgba(34,197,94,.16);color:var(--good)}
.pill.ov{background:rgba(250,178,25,.16);color:var(--warn)}
.pcards{display:none;flex-direction:column;gap:8px}
.pcard{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 12px}
.pc1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pc1 .tk{font-size:13.5px}
.pc1 .px{font-size:13.5px;font-weight:650}
.pc2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pcell{background:var(--surface-1);border-radius:7px;padding:7px 9px}
.pcell .v{display:block;font-size:12.5px;font-weight:650;margin-top:2px}
.pc3{display:flex;gap:14px;margin-top:9px;font-size:10.5px;color:var(--ink-3)}
.pc3 b{color:var(--ink-2);font-weight:600}
@media(max-width:700px){
  th.opt,td.opt{display:none}
  .tw{display:none}
  .pcards{display:flex}
}

/* trades */
.trade{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--grid);font-size:12px}
.trade:last-child{border-bottom:0}
.side{font-size:9px;font-weight:800;padding:3px 6px;border-radius:4px;height:fit-content;
  flex:none;letter-spacing:.06em;min-width:38px;text-align:center}
.side.BUY{background:rgba(34,197,94,.14);color:var(--good)}
.side.SELL{background:rgba(239,68,68,.14);color:var(--bad)}
.tb{flex:1;min-width:0}
.th2{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px;font-weight:650}
.rsn{color:var(--ink-2);font-size:11.5px;line-height:1.5}
.meta{color:var(--ink-3);font-size:10.5px;margin-top:4px}

.banner{border-radius:10px;padding:11px 13px;font-size:12px;margin-bottom:12px;line-height:1.5}
.banner.halt{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.32)}
.banner.warn{background:rgba(250,178,25,.10);border:1px solid rgba(250,178,25,.32)}
.empty{color:var(--ink-3);font-size:12px;padding:22px 0;text-align:center;line-height:1.7}
details{margin-top:9px}
summary{cursor:pointer;font-size:11.5px;color:var(--ink-2);padding:7px 0;font-weight:600}
.thesis{font-size:11.5px;color:var(--ink-2);line-height:1.7;white-space:pre-wrap;
  background:var(--surface-2);border-radius:9px;padding:13px;margin-top:7px;
  max-height:340px;overflow:auto;font-family:ui-monospace,Menlo,monospace}

/* radar */
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.rhead h2{flex:1 1 60%;min-width:0}
.spill{font-size:8.5px;font-weight:700;letter-spacing:.05em;padding:3px 7px;border-radius:5px;
  max-width:100%;white-space:normal;line-height:1.4;background:var(--surface-3);color:var(--ink-2)}
.spill.bought{background:rgba(34,197,94,.16);color:var(--good)}
.spill.rej{background:rgba(239,68,68,.13);color:var(--bad)}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:11px}
@media(min-width:700px){.rgrid{grid-template-columns:repeat(4,1fr)}}
.rm{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.rm .v{display:block;font-size:11.5px;font-weight:650;margin-top:3px;line-height:1.35}
.rsec{margin-top:12px}
.rtext{font-size:11.5px;color:var(--ink-2);line-height:1.6}
.veh{font-size:11.5px;color:var(--ink-2);line-height:1.55;padding:7px 0;border-bottom:1px solid var(--grid)}
.veh:last-child{border-bottom:0}
.veh b{color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.rlist{margin:0;padding-left:17px;font-size:11.5px;color:var(--ink-2);line-height:1.8}
footer{text-align:center;color:var(--ink-3);font-size:10.5px;margin-top:26px;line-height:1.8}
</style>
</head>

7 Opening weight 5.0% \u00b7 Horizon 12 months\nSOURCED BY THE EMERGING-THEME RADAR (IPS 3b), first run, 2026-08-14.\n\nWHY WE OWN IT\nAstera sells the connectivity silicon \u2014 signal conditioning and AI fabric \u2014 that\nholds large GPU clusters together. As clusters scale, the number of these parts\nper GPU rises. It is a volume-times-attach-rate business layered on top of the\nsame buildout the rest of the book owns, but with a different failure mode than\nthe compute names.\n\nVALUATION \u2014 the richest absolute multiple on the desk\n  Price $321.61 \u00b7 Market cap $55.79B\n  Trailing P/E 158.42 \u00b7 Forward P/E 57.31   \u2190 forward BELOW trailing\n  Revenue +98.5% y/y \u00b7 EPS $2.03 (+240.2%)\n  Consensus target $391.77 = +21.8% upside, 26 analysts\n  Growth-adjusted 0.58 \u2014 among the best on the desk\n  52-week range $97.89\u2013$499.48 \u2014 currently 36% BELOW the high\n\nThis is the clearest illustration of why the gate uses a growth-adjusted\nmultiple rather than a raw one. 57x forward earnings looks indefensible until\nyou divide by 98.5% revenue growth and get 0.58, better than almost anything\nelse owned. Both facts are true at once.\n\nCLAIMS AND VERIFICATION\n  CLAIM  Record quarterly revenue of $392.4M, +27% sequentially and +104% y/y.\n  VERIFIED  Company reporting via stockanalysis.com, 14 Aug 2026.\n\n  CLAIM  Q3 guidance of $540\u2013560M.\n  VERIFIED  Same source. That implies roughly +38% sequential growth, which is\n  the single most impressive forward number I have found on this desk.\n\nWHY IT IS ONLY 5%\nA 57x forward multiple prices in flawless execution. One guidance miss and the\nmultiple compresses violently \u2014 the 36% drawdown from its high already shows\nhow that behaves. High conviction in the business, deliberately small position,\nbecause the price allows no room for error.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Any sequential guidance miss\n  \u00b7 Hyperscalers in-sourcing connectivity silicon\n  \u00b7 Growth decelerating below ~50% while the multiple stays above 50x\n","amd":"AMD \u2014 Advanced Micro Devices\nBook: AI Trade \u00b7 Opening weight 11.0% \u00b7 Horizon 12+ months\n\nWHY WE OWN IT\nThe AI trade is rotating from training to inference, and inference is a\nmemory-bound problem rather than a raw-FLOPS problem. That shift is the single\nmost important structural change in this sector right now, and AMD is better\npositioned in inference than it ever was in training. This is the highest-\nconviction name in the book and it gets the largest weight.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  Q2 2026 revenue was $11.5B, up 50% year over year.\n  VERIFIED  AMD investor relations, Q2 2026 results release (primary source).\n  Prior-year comparison $7.685B. Confirms.\n\n  CLAIM  Data center revenue grew 107% y/y to $6.718B, now 58% of the company.\n  VERIFIED  Same primary source. This is the number that matters: the data\n  center segment has crossed from a side business into the majority of AMD.\n\n  CLAIM  Margins are expanding, not being bought with price cuts.\n  VERIFIED  Non-GAAP gross margin 56% vs 43% a year ago. GAAP EPS $1.38,\n  +156% y/y. Growth is falling through to profit.\n\n  CLAIM  Q3 2026 guidance is ~$13B, +41% y/y.\n  VERIFIED  Company guidance in the same release, with a stated +/- $300M band.\n\n  CLAIM  AMD holds large-scale inference agreements with OpenAI, Meta,\n  Microsoft and Anthropic.\n  PARTIALLY CONFIRMED  Widely reported and consistent with company statements\n  at Advancing AI 2026, but I did not locate signed-contract terms in a filing.\n  Treated as supporting color, NOT as the load-bearing reason to own this.\n\n  CLAIM  Inference TAM reaches $1.3T by 2032 (32% CAGR), about 2x training.\n  UNVERIFIED  Sourced to Bloomberg Intelligence via secondary reporting. A\n  forecast, not a fact. Directionally useful, not relied upon.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Data center growth decelerating below ~40% y/y for two straight quarters\n  \u00b7 Gross margin rolling back under 50%\n  \u00b7 A named hyperscaler publicly standardizing away from AMD for inference\n  \u00b7 Total AI capex guidance across hyperscalers being cut\n\nEXIT CONDITIONS\nThesis-driven, plus the book's hard -20% stop from cost.\n","amzn":"AMZN \u2014 Amazon\nBook: Core \u00b7 Opening weight 7.5% \u00b7 Horizon multi-year\nNEW POSITION.\n\nWHY WE OWN IT\nAWS is the demand side of everything the AI book owns on the supply side, and\nretail plus advertising funds the capex without needing to raise money.\n\nVALUATION \u2014 the least comfortable pass in the Core book\n  Price $262.65 \u00b7 Market cap $2.83T\n  Trailing P/E 21.32 \u00b7 FORWARD P/E 28.54  \u2190 forward ABOVE trailing\n  Revenue +15.8% y/y \u00b7 Net income +91.6% y/y\n  Consensus target $326.07 = +24.2% upside, 60 analysts, Strong Buy\n  Growth-adjusted multiple 1.81 vs the 2.0 limit\n\nFLAGGED, per IPS 3a: the forward multiple sits above the trailing one, meaning\nconsensus expects earnings to fall. Net income up 91.6% is not a repeatable\nnumber, so trailing earnings are flattered and the honest multiple is 28.54x,\nnot 21.32x. Judged on that basis it still passes at 1.81 \u2014 but 1.81 against a\n2.0 limit is a scrape, and it is sized below META and GOOGL because of it.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 AWS growth decelerating while capex stays elevated\n  \u00b7 Retail margin compression\n  \u00b7 The 1.81 growth-adjusted figure deteriorating on the next print\n","avgo":"AVGO \u2014 Broadcom\nBook: AI Trade \u00b7 Opening weight 10.0% \u00b7 Horizon 12+ months\n\nWHY WE OWN IT\nThe hyperscalers all want to stop paying Nvidia's margin. Every one of them\nthat tries builds custom silicon, and Broadcom is who they build it with. This\nis the position that pays off in the scenario where NVDA disappoints \u2014 the\nin-book hedge that is also a good business on its own.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  Broadcom's custom AI accelerator business is described as a $100B+\n  opportunity in fiscal 2027.\n  PARTIALLY CONFIRMED  Reported via secondary source (Motley Fool, Aug 2026)\n  attributing the framing to the company. I did not confirm the figure in a\n  Broadcom filing or transcript. Directionally relied upon, NOT precisely.\n\n  CLAIM  Broadcom is a top-11 holding in Jim Cramer's Charitable Trust.\n  VERIFIED  Trust holdings list as of 30 June 2026. Noted only because this\n  book is explicitly benchmarked against him; it is not a reason to own it.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 A major hyperscaler abandoning its custom silicon program\n  \u00b7 Custom ASIC revenue growth decelerating while merchant GPU accelerates\n","cbrs":"CBRS \u2014 Cerebras Systems\nBook: Moonshot \u00b7 Opening weight 8.0% \u00b7 Horizon 12 months\n\nWHY WE OWN IT\nThis is the one name that currently fits the mandate you described: enormous\nsentiment, credible high price targets, a story running well ahead of profits,\nand a business early enough that the outcome is genuinely undecided. Wafer-scale\nchips with embedded SRAM are architecturally well-suited to exactly the\ninference workloads the market is rotating toward.\n\nCLAIMS AND VERIFICATION  (all figures from Cerebras investor relations, Q1 2026\nrelease \u2014 primary source)\n\n  CLAIM  Q1 2026 revenue of $193.4M, up 94% year over year.\n  VERIFIED  Confirms. Core revenue $191.3M, +92%.\n\n  CLAIM  Cloud and services revenue up 178% y/y to $82.8M.\n  VERIFIED  Confirms. The mix shift toward recurring cloud revenue is the most\n  encouraging line in the release and is the actual reason I am buying.\n\n  CLAIM  FY2026 core revenue guidance of $855-865M, ~+69% y/y at midpoint.\n  VERIFIED  Company guidance. Confirms.\n\n  CLAIM  A $20B+ multi-year OpenAI agreement covering 750MW of capacity.\n  VERIFIED  Disclosed by the company.\n\n  CLAIM  It is roughly break-even, not deeply lossmaking.\n  VERIFIED  GAAP net loss $(14.0)M, core net loss $(2.5)M on $193M revenue.\n  Unusual for a company at this growth rate and it materially de-risks the story.\n\nTHE RISKS, STATED PLAINLY  \u2014 I am not burying these\n\n  1. CUSTOMER CONCENTRATION. The company itself discloses dependence on \"a\n     limited number of significant customers, including OpenAI, Group 42\n     Holding Ltd, Mohamed bin Zayed University of Artificial Intelligence, and\n     AWS.\" If OpenAI reworks its commitment, the thesis breaks in one press\n     release. This is the single largest risk and it is disclosed by them, not\n     discovered by me.\n\n  2. IPO'd 14 May 2026 \u2014 about three months of public history. There are no\n     four public quarters to check management's guidance credibility against.\n     I cannot yet grade whether they do what they say.\n\n  3. GROSS MARGIN GUIDANCE OF 38-41% for FY26, DOWN from 47% core in Q1. The\n     company is guiding its own margins lower. That is either scale-up cost or\n     pricing pressure, and I do not yet know which.\n\n  4. Priced for a great outcome after the largest IPO of 2026.\n\nWHY IT IS 8% AND NOT MORE\nFour disclosed risks, three months of public history, and margin guidance\nmoving the wrong way. Conviction in the thesis does not entitle it to size.\n\nEXIT CONDITIONS\n  \u00b7 Any material change to the OpenAI relationship\n  \u00b7 FY26 core revenue guidance cut below $855M\n  \u00b7 Gross margin guided below 35%\n  \u00b7 The book's hard -25% stop from cost\n","ceg":"CEG \u2014 Constellation Energy\nBook: AI Trade \u00b7 Opening weight 7.5% \u00b7 Horizon 12+ months\n\nWHY WE OWN IT\nThe binding constraint on AI is shifting from chips to electricity. Data\ncenters need power that is carbon-free, always-on, and available at scale, and\nin the United States that describes the existing nuclear fleet almost uniquely.\nConstellation owns the largest one. This is the book's answer to the question\n\"what breaks first,\" and it is not correlated with the semiconductor names.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  AI data center demand is driving an electricity supercycle, with power\n  a genuine constraint on the buildout.\n  VERIFIED  GE Vernova Q2 2026 reported $2.7B of data center orders in\n  Electrification alone, first-half data center orders above $5B (more than\n  double all of 2025), and gas power \"mostly sold out through 2030.\" Independent\n  confirmation that power, not compute, is the scarce input.\n\n  CLAIM  Constellation specifically has contracted nuclear capacity to\n  hyperscaler data centers.\n  UNVERIFIED  I did not confirm current contract terms in a primary filing this\n  session. This is the weakest-verified position in the book and is sized\n  accordingly at 7.5%. It is on the list for primary-source verification at the\n  first monthly cycle, and I will cut it if the specifics do not hold up.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Power turning out not to be a binding constraint (watch GEV order growth)\n  \u00b7 Adverse regulatory treatment of behind-the-meter data center deals\n","cohr":"COHR \u2014 Coherent Corp\nBook: AI Trade \u00b7 Opening weight 6.5% \u00b7 Horizon 12+ months\nSOURCED BY THE EMERGING-THEME RADAR (IPS 3b), first run, 2026-08-14.\n\nWHY WE OWN IT\nThe AI bottleneck is migrating from the chip to the link between chips. At\ncluster scale, copper runs out of headroom on power and latency before it runs\nout of bandwidth, which forces optics into the package. Broadcom's own framing\nis the tell: \"our switches and XPUs are going to be lower power with optics than\nwith copper.\" Optics justify themselves on efficiency, not just speed \u2014 which\nmeans adoption is driven by the electricity bill, the hardest constraint there is.\n\nCoherent makes the optoelectronic components and engineered materials this\ntransition runs on.\n\nVALUATION\n  Price $325.83 \u00b7 Market cap $63.75B\n  Trailing P/E 79.09 \u00b7 Forward P/E 35.20   \u2190 forward BELOW trailing\n  Revenue +22.5% y/y \u00b7 Net income +1,530.7% y/y\n  Consensus target $410.76 = +26.1% upside, 22 analysts\n  Growth-adjusted 1.56 vs the 2.0 limit\n  52-week range $84.35\u2013$440.00 \u2014 currently 26% BELOW the high\n\nThat last line matters as much as the multiple. The optics complex has rallied\nhard, and buying a theme after it runs is how you lose money being right. This\none has already given back a quarter of its move.\n\nCLAIMS AND VERIFICATION\n  CLAIM  The Open Compute Interconnect standard was founded by AMD, Broadcom,\n  NVIDIA, Meta, Microsoft and OpenAI.\n  VERIFIED  OFC 2026 conference coverage. When six competitors agree a standard,\n  the direction is settled and only the timing is in question.\n\n  CLAIM  Volume production for CPO/silicon photonics integration targets 2028,\n  with full GPU-HBM package integration around 2029.\n  PARTIALLY CONFIRMED  Conference reporting, not company guidance. An industry\n  roadmap, and roadmaps slip.\n\n  CLAIM  NVIDIA invested $2B in Lumentum as part of a ~$4B optical strategy.\n  PARTIALLY CONFIRMED  Secondary reporting. Used as evidence the theme is real,\n  NOT as a reason to own this specific name.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 CPO timelines slipping past 2028 \u2014 the whole thesis is timing\n  \u00b7 Hyperscalers standardizing on pluggable optics for longer than expected\n  \u00b7 35x forward compressing toward the components-sector average\n","cost":"COST \u2014 Costco\nSTATUS: **REJECTED BY THE VALUATION GATE (IPS 3a)** on 2026-08-14. NOT OWNED.\n\nThis name was in my first roster. The client asked whether the good news was\nalready priced in. It was. The order was cancelled before any money moved.\n\n  Price               $961.10\n  Forward P/E         43.89\n  Implied upside      +12.1%   (floor is +15%)\n  Growth-adjusted     3.43   (limit is 2.0)\n\nWHY IT FAILED\n43.89x forward for 9.2% revenue growth. I flagged in the original thesis that it was persistently expensive and responded by sizing it down. The gate says size-down was the wrong response \u2014 if the price is wrong, own none of it.\n\nWHAT WOULD BRING IT BACK\nA materially lower price, a genuine step-up in forward estimates, or consensus\ntargets moving up enough to restore 15%+ implied upside. The business quality\nwas never the question \u2014 the price was. I will re-run this name through the gate\nevery monthly cycle, and if it clears, I will buy it and say so.\n","etn":"ETN \u2014 Eaton\nSTATUS: **REJECTED BY THE VALUATION GATE (IPS 3a)** on 2026-08-14. NOT OWNED.\n\nThis name was in my first roster. The client asked whether the good news was\nalready priced in. It was. The order was cancelled before any money moved.\n\n  Price               $453.33\n  Forward P/E         30.72\n  Implied upside      +4.1%   (floor is +15%)\n  Growth-adjusted     n/a (EPS -1.2%)   (limit is 2.0)\n\nWHY IT FAILED\nWorst implied upside on the entire desk: 4.11% to a 27-analyst consensus target. Trailing EPS is NEGATIVE year over year while the stock pays 30.72x forward. The data center demand story is completely correct and completely priced.\n\nWHAT WOULD BRING IT BACK\nA materially lower price, a genuine step-up in forward estimates, or consensus\ntargets moving up enough to restore 15%+ implied upside. The business quality\nwas never the question \u2014 the price was. I will re-run this name through the gate\nevery monthly cycle, and if it clears, I will buy it and say so.\n","gev":"GEV \u2014 GE Vernova\nSTATUS: **REJECTED BY THE VALUATION GATE (IPS 3a)** on 2026-08-14. NOT OWNED.\n\nThis name was in my first roster. The client asked whether the good news was\nalready priced in. It was. The order was cancelled before any money moved.\n\n  Price               $1,063.25\n  Forward P/E         49.31 forward vs 30.03 trailing\n  Implied upside      +16.5%   (floor is +15%)\n  Growth-adjusted     3.79   (limit is 2.0)\n\nWHY IT FAILED\nThe $176B backlog is real, verified, and entirely in the price. Forward P/E sits ABOVE trailing, meaning consensus expects earnings to FALL \u2014 trailing net income was up 724% y/y, which is not repeatable. Lowest revenue growth on the desk (+13%) at the highest forward multiple on the desk. An independent DCF puts pure fair value at $295-491; the blended base case is $1,019 against a $1,063 price. Adjusted EPS missed consensus by ~19% last quarter DESPITE a revenue beat \u2014 backlog-to-earnings conversion is exactly the weak point. Wind orders -40% y/y.\n\nWHAT WOULD BRING IT BACK\nA materially lower price, a genuine step-up in forward estimates, or consensus\ntargets moving up enough to restore 15%+ implied upside. The business quality\nwas never the question \u2014 the price was. I will re-run this name through the gate\nevery monthly cycle, and if it clears, I will buy it and say so.\n","googl":"GOOGL \u2014 Alphabet\nBook: Core \u00b7 Opening weight 7.0% \u00b7 Horizon multi-year\n\nWHY WE OWN IT\nAlphabet is the only company that owns the full stack \u2014 its own silicon (TPU),\nits own data centers, its own models, and a search/advertising business that\nprints the cash to fund all of it. In a market paying enormous multiples for\nsingle links in the AI chain, owning the whole chain at a lower multiple is the\nbetter trade.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  Alphabet is a hyperscaler contributing to the ~$840B 2026 capex figure.\n  VERIFIED  Axios, 5 Aug 2026.\n\n  CLAIM  Google's TPU program is a credible custom-silicon alternative to\n  merchant GPUs.\n  PARTIALLY CONFIRMED  Consistent with the custom-ASIC trend confirmed through\n  Broadcom's business, but I did not verify TPU deployment scale in a primary\n  filing this session.\n\n  CLAIM  Alphabet is Cramer's trust's largest technology position.\n  PARTIALLY CONFIRMED  It is a holding as of 30 June 2026; the source does NOT\n  disclose position weights, so I cannot confirm the ranking. Flagged rather\n  than repeated.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Search revenue decelerating as AI assistants displace query volume\n  \u00b7 An adverse antitrust remedy that structurally separates the business\n","jpm":"JPM \u2014 JPMorgan Chase\nSTATUS: **REJECTED BY THE VALUATION GATE (IPS 3a)** on 2026-08-14. NOT OWNED.\n\nThis name was in my first roster. The client asked whether the good news was\nalready priced in. It was. The order was cancelled before any money moved.\n\n  Price               $362.84\n  Forward P/E         15.03\n  Implied upside      +3.2%   (floor is +15%)\n  Growth-adjusted     0.77   (limit is 2.0)\n\nWHY IT FAILED\nThe cheapest multiple of anything rejected, and still rejected. 15.03x forward with a 0.77 growth-adjusted figure looks like value until you see 3.23% implied upside. A low multiple is not an opportunity when the entire street already agrees the stock is worth roughly what it costs.\n\nWHAT WOULD BRING IT BACK\nA materially lower price, a genuine step-up in forward estimates, or consensus\ntargets moving up enough to restore 15%+ implied upside. The business quality\nwas never the question \u2014 the price was. I will re-run this name through the gate\nevery monthly cycle, and if it clears, I will buy it and say so.\n","lin":"LIN \u2014 Linde\nSTATUS: **REJECTED BY THE VALUATION GATE (IPS 3a)** on 2026-08-14. NOT OWNED.\n\nThis name was in my first roster. The client asked whether the good news was\nalready priced in. It was. The order was cancelled before any money moved.\n\n  Price               $482.74\n  Forward P/E         25.82\n  Implied upside      +13.3%   (floor is +15%)\n  Growth-adjusted     2.53   (limit is 2.0)\n\nWHY IT FAILED\nA genuinely wonderful business at a full price. 25.82x forward against 10.2% EPS growth and 3.0% revenue growth. Quality is not a valuation argument.\n\nWHAT WOULD BRING IT BACK\nA materially lower price, a genuine step-up in forward estimates, or consensus\ntargets moving up enough to restore 15%+ implied upside. The business quality\nwas never the question \u2014 the price was. I will re-run this name through the gate\nevery monthly cycle, and if it clears, I will buy it and say so.\n","meta":"META \u2014 Meta Platforms\nBook: Core \u00b7 Opening weight 8.0% \u00b7 Horizon multi-year\nNEW POSITION \u2014 replaced names the valuation gate rejected.\n\nWHY WE OWN IT\nThis is the strongest valuation pass in the Core book, and it is not close.\n\nVALUATION\n  Price $589.85 \u00b7 Market cap $1.50T\n  Trailing P/E 22.42 \u00b7 Forward P/E 18.58  \u2190 forward BELOW trailing\n  Revenue +27.7% y/y\n  Consensus target $754.14 = +27.9% upside, 62 analysts, Strong Buy\n  Growth-adjusted multiple 0.67\n\nForward P/E below trailing means consensus expects earnings to RISE \u2014 the exact\nopposite of the GE Vernova signature that got that name rejected. An 18.58x\nmultiple on 27.7% revenue growth is the cheapest growth-adjusted number\navailable in a large-cap outside the semiconductor complex.\n\n  CLAIM  Revenue +27.7% TTM, net income -4.8%.\n  VERIFIED  stockanalysis.com, 14 Aug 2026. The earnings decline against rising\n  revenue is AI infrastructure spending hitting the P&L. That is the thing the\n  market is discounting, and it is also the thing I am willing to pay for.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 AI capex rising without a matching revenue return \u2014 capex without payback\n    is just cost\n  \u00b7 Adverse outcomes in the youth-harm litigation\n  \u00b7 Engagement declining in core apps\n\nRISK I AM ACCEPTING KNOWINGLY\nLitigation risk here is genuine and unquantifiable by me.\n","msft":"MSFT \u2014 Microsoft\nBook: Core \u00b7 Opening weight 7.8% \u00b7 Horizon multi-year\n\nWHY WE OWN IT\nThe core sleeve needs positions that compound through cycles without requiring\nme to be clever. Microsoft is the highest-quality way to own AI monetization\ninside a business with enterprise software economics underneath it, so the AI\nthesis being early or wrong costs far less here than it would in a pure play.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  Microsoft is among the hyperscalers whose 2026 capex guidance drove\n  aggregate expectations to ~$840B from $487B in February.\n  VERIFIED  Axios, 5 Aug 2026 (aggregate figure; Microsoft named among the\n  hyperscalers driving it).\n\n  CLAIM  Microsoft is a holding in Cramer's Charitable Trust.\n  VERIFIED  Holdings as of 30 June 2026. Noted for benchmark context only.\n\nNOTE ON VALUATION\nThe S&P 500 is at record highs (7,736.52 close, Aug 2026) with an active public\ndebate about AI-capex-driven overvaluation. I am not claiming this is cheap.\nI am claiming it is durable, which is a different and more defensible claim.\n","mu":"MU \u2014 Micron Technology\nBook: AI Trade \u00b7 Opening weight 10.0% \u00b7 Horizon 12+ months\nNEW POSITION \u2014 the memory leg this book was missing.\n\nWHY WE OWN IT\nInference is a memory-bound problem, not a FLOPS-bound one. Every argument in\nthis book about the rotation from training to inference implies memory demand,\nand until now the book had no memory exposure at all. That was a hole.\n\nMicron is also, by a wide margin, the cheapest thing on this desk.\n\nVALUATION  (the reason this is a large position)\n  Price $971.66 \u00b7 Market cap $1.10T\n  Trailing P/E 21.43 \u00b7 FORWARD P/E 6.61\n  Revenue +167% y/y \u00b7 EPS +705.7% y/y\n  Consensus target $1,501.98 = +54.6% upside, 46 analysts, Strong Buy\n  Growth-adjusted multiple 0.04 vs the 2.0 limit\n\nA 6.61x forward multiple on a company growing revenue 167% is not a rounding\nerror, it is a statement. The market is saying: these are peak-cycle earnings\nand they will collapse, so we refuse to capitalize them. That is the memory\ndiscount, and historically the market has often been right to apply it.\n\nTHE ACTUAL BET, STATED HONESTLY\nI am betting this cycle is structurally different, for one specific reason:\nHBM for AI accelerators is contracted years forward, not sold spot like\ncommodity DRAM. Contracted capacity does not behave like a commodity glut.\n\n  CLAIM  The memory shortage may persist past 2030.\n  PARTIALLY CONFIRMED  Attributed to SK Hynix via secondary reporting. It is a\n  competitor's forecast, not a fact, and forecasts from people who benefit from\n  scarcity deserve discounting. Directional support only.\n\n  CLAIM  Revenue +167% y/y, forward P/E 6.61, target $1,501.98.\n  VERIFIED  stockanalysis.com, 14 Aug 2026.\n\nWHAT WOULD MAKE ME WRONG \u2014 and this is a real risk, not a formality\n  \u00b7 The market is simply right: HBM capacity floods in, pricing breaks, and the\n    6.61x forward multiple turns out to be 6.61x on earnings that halve\n  \u00b7 DRAM contract pricing rolling over\n  \u00b7 Any hyperscaler cutting memory procurement guidance\n\nIf the multiple is a trap, it is a trap I walked into knowingly. A cheap\ncyclical at the top of its cycle is the oldest mistake in equities. I am sizing\nthis at 10% rather than the 12% cap for exactly that reason.\n","nvda":"NVDA \u2014 Nvidia\nBook: AI Trade \u00b7 Opening weight 10.5% \u00b7 Horizon 12+ months\n\nWHY WE OWN IT\nYou do not get to be underweight the toll booth while arguing the road is being\nwidened. Nvidia is deliberately sized BELOW AMD here despite being the larger\nand safer company, because the incremental surprise is more likely to come from\nthe challenger than the incumbent, and because a portfolio called \"the AI trade\"\nthat is mostly Nvidia is really just a single-stock bet wearing a costume.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  Nvidia is extending from training into inference silicon, including\n  Groq-derived LPU technology with embedded SRAM for the decode phase.\n  PARTIALLY CONFIRMED  Reported by Motley Fool (Aug 2026) and consistent with\n  the broader inference narrative. I did NOT verify the acquisition terms in a\n  filing. Supporting color only.\n\n  CLAIM  Hyperscaler 2026 capex expectations run near $840B, up from $487B in\n  early February 2026.\n  VERIFIED  Axios, 5 Aug 2026, citing tracked hyperscaler guidance. This is the\n  demand curve underneath the whole book, and it is still revising upward.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Hyperscaler capex guidance revised DOWN \u2014 the cleanest single tell\n  \u00b7 Custom ASICs (Broadcom/Google TPU) taking visible inference share\n  \u00b7 Gross margin compression signaling lost pricing power\n\nRISK I AM ACCEPTING KNOWINGLY\nThis is a consensus long at a record-high market. I am not being paid for\noriginality here; I am being paid not to be cute about the largest and most\nobvious beneficiary of the largest capex cycle in the sector's history.\n","tsm":"TSM \u2014 Taiwan Semiconductor\nBook: AI Trade \u00b7 Opening weight 9.0% \u00b7 Horizon 12+ months\n\nWHY WE OWN IT\nEvery name in this book \u2014 Nvidia, AMD, Broadcom, Cerebras \u2014 ultimately queues\nat the same foundry. Owning TSM is owning the bottleneck rather than guessing\nwhich customer wins the argument above it. In a book about a compute buildout,\nthis is the position with the least dependence on picking the right architecture.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  TSMC manufactures leading-edge silicon for essentially all major AI\n  accelerator designers.\n  VERIFIED  Structural industry fact, confirmed across company disclosures and\n  the customer relationships named in AMD, Nvidia and Broadcom reporting.\n\n  CLAIM  The 2026 semiconductor cycle is being driven by AI infrastructure.\n  PARTIALLY CONFIRMED  Deloitte 2026 semiconductor outlook and multiple sources\n  agree directionally. Used as context, not as a specific number.\n\nRISK I AM ACCEPTING KNOWINGLY\nTaiwan geopolitical risk is real, unhedgeable, and not priced by any model I\nhave. It is the explicit reason this is 9% and not 15%. If that risk is\nunacceptable to you, say so and I will exit \u2014 it is a values question, not an\nanalytical one.\n","unh":"UNH \u2014 UnitedHealth Group\nBook: Core \u00b7 Opening weight 6.5% \u00b7 Horizon multi-year\nNEW POSITION \u2014 the non-technology ballast.\n\nWHY WE OWN IT\nAfter the valuation gate finished, the Core book was four mega-cap technology\nnames and a healthcare ETF. That is not a diversified portfolio, it is an AI bet\nwith extra steps \u2014 and it would have been highly correlated with the AI book.\nUNH is the deliberate correction.\n\nVALUATION \u2014 a documented edge case\n  Price $401.73 \u00b7 Market cap $360.59B\n  Trailing P/E 25.86 \u00b7 Forward P/E 18.88  \u2190 forward BELOW trailing\n  Trailing EPS $15.53, DOWN 32.8% y/y\n  Consensus target $475.23 = +18.3% upside, 27 analysts, Buy\n\nA naive growth-adjusted test would fail this: you cannot divide a multiple by\nnegative growth. But the trailing decline IS the opportunity \u2014 the multiple has\nalready de-rated for it. Forward P/E of 18.88 against trailing 25.86 implies\nroughly 37% forward earnings recovery, giving a growth-adjusted figure of 0.51.\n\nThat method is now written into IPS 3a and research/valuation.json, before the\nfact, precisely so it cannot be applied selectively to rescue names I like.\n\n  CLAIM  \"UnitedHealth blows past estimates, hikes earnings outlook as it reins\n  in costs.\"\n  PARTIALLY CONFIRMED  Reported via stockanalysis.com's news summary. The beat\n  and raise is consistent with forward P/E sitting below trailing. I did NOT\n  read the primary release this session. Flagged for verification.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Medical loss ratio deteriorating again\n  \u00b7 Medicare Advantage rate or regulatory pressure\n  \u00b7 The recovery in forward estimates not materializing in the next two prints\n","vrt":"VRT \u2014 Vertiv Holdings\nBook: AI Trade \u00b7 Opening weight 5.5% \u00b7 Horizon 12 months\nNEW POSITION \u2014 thermal and power distribution inside the rack.\n\nWHY WE OWN IT\nRack densities are rising faster than air cooling can handle, which forces\nliquid cooling. Vertiv sells the thermal management and power distribution that\nsits between the utility feed and the GPU. It is the least glamorous link in the\nchain and one of the hardest to design around.\n\nVALUATION \u2014 the weakest pass in the book\n  Price $293.84 \u00b7 Market cap $113.12B\n  Trailing P/E 66.50 \u00b7 Forward P/E 37.69\n  Revenue +26.2% y/y \u00b7 EPS +168.8% (2025)\n  Consensus target $338.15 = +15.08% upside, 28 analysts, Strong Buy\n  Growth-adjusted multiple 1.44 vs the 2.0 limit\n\nIt clears the 15% upside floor by 0.08 percentage points. That is a pass, and\nit is a pass I am not proud of. Hence the smallest position in the book.\n\n  CLAIM  Recent results were mixed; management called the issues \"a temporary\n  issue\" relating to project timing and supply chain.\n  VERIFIED as a quote. Treated with the skepticism that phrase deserves \u2014 it is\n  what every management team says, and it is right maybe half the time.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 \"Temporary\" project-timing issues recurring next quarter\n  \u00b7 Multiple compression toward the sector \u2014 at 37.69x forward there is a\n    long way to fall\n  \u00b7 Hyperscalers standardizing on in-house thermal designs\n","xlv":"XLV \u2014 Health Care Select Sector SPDR\nBook: Core \u00b7 Opening weight 5.4% \u00b7 Horizon multi-year\n\nWHY WE OWN IT\nTwo reasons, and I want to be straight about the second one.\n\nFirst: healthcare is the sector where I have the least edge. Drug pipelines and\nreimbursement policy are genuinely hard, and single-name healthcare risk is\nbrutal \u2014 one FDA decision can halve a stock. An ETF buys the sector exposure\nwithout pretending I can pick within it. Using an index fund where you lack an\nedge is discipline, not laziness.\n\nSecond: sector leadership rotated toward healthcare in 2026 while technology\nconsolidated.\n\nCLAIMS AND VERIFICATION\n\n  CLAIM  Healthcare led US sector performance in August 2026.\n  PARTIALLY CONFIRMED  Reported by Algo Lab's August 2026 sector focus. A\n  single secondary source; I did not corroborate it independently. This is\n  supporting context, not the reason to own it. The first reason stands alone.\n\nWHAT WOULD MAKE ME WRONG\n  \u00b7 Adverse drug pricing legislation\n  \u00b7 If I develop genuine single-name conviction here, this converts to stocks\n"},"watchlist":{"_purpose":"Emerging theme radar. The client's instruction: space data centers was an EXAMPLE of a class - themes with low absolute chatter and rising interest, where the upside is caught early. This file tracks those themes between cycles, so the hunt is systematic rather than whatever I happened to think of that week. Reviewed every two weeks. IPS 3b.","_scoring":{"chatter":"LOW / MEDIUM / HIGH - absolute mainstream coverage. LOW is what we want.","trajectory":"RISING / FLAT / FALLING - direction of interest. RISING + LOW is the target quadrant.","capital_committed":"Has real money moved? Funding rounds, capex line items, regulatory filings. Money moves before articles do.","vehicle_quality":"GOOD / DILUTED / NONE - is there a public company whose economics actually concentrate the theme? This is the test most themes fail.","time_to_pnl":"When does this hit an income statement?","status":"WATCHING / ACTIONABLE / BOUGHT / REJECTED"},"_last_review":"2026-08-14","_next_review":"2026-08-28","themes":[{"id":"co-packaged-optics","name":"Co-packaged optics / silicon photonics","thesis":"The AI bottleneck is moving from the chip to the interconnect between chips. Copper is running out of headroom on power and latency at cluster scale, forcing optics directly into the package. Broadcom's framing is the tell: 'our switches and XPUs are going to be lower power with optics than with copper' - optics justify themselves on efficiency, not just bandwidth.","chatter":"MEDIUM","trajectory":"RISING","capital_committed":"NVIDIA invested $2B in Lumentum as part of a reported $4B optical strategy. The Open Compute Interconnect standard was founded by AMD, Broadcom, NVIDIA, Meta, Microsoft and OpenAI together. Samsung and ST are bringing silicon photonics to 300mm wafer platforms.","vehicle_quality":"GOOD","time_to_pnl":"Revenue now, inflection at 2028 volume production for CPO integration; 2029 for full GPU-HBM package integration.","status":"BOUGHT","vehicles":{"COHR":"BOUGHT. Passes the gate: 35.20x fwd, +26.1% upside, forward BELOW trailing. Trades 26% below its 52-week high, so not chasing a top.","ALAB":"BOUGHT. Passes: 57.31x fwd but revenue +98.5% gives 0.58 growth-adjusted. Q3 guided $540-560M vs $392.4M actual.","LITE":"REJECTED - already ran. $111.20 to $926.14 across the 52-week range, market cap +888% y/y. Negative trailing earnings. The theme is real; this vehicle is late. Being right about a theme and buying it at 8x is still losing.","MRVL/AVGO/NVDA":"Already held or adjacent exposure via AVGO and NVDA."},"sources":["OFC 2026 conference coverage (SemiWiki, EE Times)","io-fund on NVIDIA's optical strategy"]},{"id":"transformer-goes-shortage","name":"Power transformers and grain-oriented electrical steel","thesis":"A real, well-documented hard constraint on the AI buildout: power transformer lead times went from ~50 weeks in 2021 to ~120 weeks by 2024 (Wood Mackenzie), large units run 80-210 weeks, prices are up 60-80% since Jan 2020, and only ~20% of US demand can be met domestically. It slows the PACE of the buildout and favours the supply-constrained names. CORRECTION 2026-08-14: I originally carried a '30-50% of 2026 capacity cancelled' bear claim here as a risk to this desk's own AI book. On verification that framing is substantially overstated \u2014 SemiAnalysis showed the underlying denominator is off by multiples, the shortfall sits in speculative announcements that were never real 2026 projects, and their own forecast moved ~1% in six months. Meanwhile hyperscaler capex was RAISED to $725B (+77% y/y). Constraint: real. Demand threat: not supported. See the full note below.","chatter":"LOW","trajectory":"RISING","capital_committed":"Cleveland-Cliffs' Butler Works is the only domestic producer of grain-oriented electrical steel and the only domestic source of the high-permeability grade used in power transformers. Its $170M expansion does not arrive until 2028.","vehicle_quality":"DILUTED","time_to_pnl":"Now, but buried inside larger businesses.","status":"WATCHING \u00b7 BEAR CASE DOWNGRADED","vehicles":{"CLF":"REJECTED. The perfect narrative and the wrong vehicle. Consensus target $11.80 against an $11.90 price = -0.8% DOWNSIDE, Hold rating from 13 analysts, and the company is lossmaking (-$876M net income, EPS -$1.60). The GOES monopoly is a rounding error inside $19.2B of commodity steel revenue that mostly serves autos. An under-covered theme is only investable if some vehicle's economics actually concentrate it.","_todo":"Still the highest-priority open item: find a liquid US-listed pure-play transformer or grid-equipment vehicle. Screen Hitachi Energy, Siemens Energy, Prolec, Hammond Power for a US listing or ADR clearing IPS 8 liquidity."},"note":"VERIFIED AND REVISED 2026-08-14. I initially flagged '30-50% of announced data center capacity may slip' as a risk to this desk's AI book, on the strength of one Medium post and a Forbes piece. That was below the evidence standard I apply to buying a stock, so it should not have been enough to argue against one. On checking:\n\nSOURCE OF THE CLAIM: Currence, an energy intelligence firm, tracking 777 announced AI factories >50MW. ~190GW announced since 2024; 16GW scheduled for 2026 operation; ~5GW under construction.\n\nTHE REBUTTAL (SemiAnalysis, the most credible source in this niche, published specifically to correct this): (1) the 5GW denominator is 'off by multiples' \u2014 their satellite imagery shows the top TWO hyperscalers alone exceed 5GW under construction; (2) the cancellations cluster in early-stage speculative announcements lacking site control, financing or interconnection \u2014 projects never realistic for 2026 anyway; (3) SemiAnalysis's own year-end 2026 North America hyperscaler self-build forecast moved only ~1% over six months, colocation under 5% \u2014 the people modeling this most carefully barely changed their numbers; (4) the meme traces to an April 2026 Bloomberg piece about Chinese electrical parts, sharpened into clickbait downstream.\n\nALSO: 'delayed' is not 'cancelled'. Currence itself measures timeline slippage, not abandonment. Delays push revenue right; they do not destroy it.\n\nMEANWHILE THE DEMAND SIDE ACCELERATED: 2026 hyperscaler capex $725B, up 77% from $410B in 2025 \u2014 MSFT $190B, Alphabet up to $190B (+$5B), Meta $145B+ (+$10B). Guidance RAISED, not cut. And the revenue is showing up: Google Cloud +63% y/y to $20B/quarter, Meta +33% to $56.3B, Alphabet net income +81% to $62.6B. GE Vernova's Q2 call disclosed Gas Power capacity rising to 30GW by 2030, near-full utilization of 2030 slots, and >50% of 2031 capacity contracted by year-end 2026 \u2014 contracted, prepaid, multi-year commitments are the opposite of a demand air pocket.\n\nCONCLUSION: the transformer constraint is real and well documented (Wood Mackenzie: lead times 50wk in 2021 to 120wk by 2024, large units 80-210wk, prices +60-80% since Jan 2020, only ~20% of US demand met domestically). It slows the PACE of buildout. It does not undermine the demand thesis, and the '30-50% cancelled' framing is substantially overstated. I am REMOVING this as a bear case against the AI book and keeping it as a TIMING consideration that favours the supply-constrained names over those needing new capacity online fast.\n\nWHAT I GOT WRONG: I amplified a thinly-sourced bear claim without checking it, in the same session I wrote a rule requiring primary-source verification. The client asked me to explain it, which is what surfaced the error.","sources":["The Geopolitical Economist on the transformer shortage","Forbes on transformers vs chips"],"tripwires":["GE Vernova order growth decelerating (quarterly, public)","Any hyperscaler CUTTING capex guidance \u2014 none have; all raised","Transformer lead times extending materially beyond ~120-128 weeks","SemiAnalysis revising its self-build forecast down by more than 5%"]},{"id":"orbital-compute","name":"Space / orbital data centers","thesis":"Terrestrial data centers are constrained by land, power and water. Orbital compute is constrained by launch cost, which falls on a technology curve rather than a resource curve.","chatter":"LOW","trajectory":"RISING","capital_committed":"Blue Origin filed for 51,600 data center satellites. Starcloud reached a $1.1B valuation. Meta signed a space-based power agreement with Overview Energy. Google's Project Suncatcher completed radiation testing with two prototypes planned for early 2027. SpaceX targets Starmind AI1 as early as 2027 using NVIDIA Vera CPUs and Rubin GPUs.","vehicle_quality":"DILUTED","time_to_pnl":"2027 prototypes; economic parity projected 2038-2040.","status":"WATCHING","vehicles":{"NVDA":"HELD. Disclosed $21B stake in SpaceX plus the Starmind AI1 compute partnership. The cleanest exposure, and free inside a position owned for other reasons.","GOOGL":"HELD. Project Suncatcher.","RKLB":"MOONSHOT-PENDING. 2 of 4 Moonshot criteria verified. Trades 47% below its 52-week high, so not disqualified for having run.","RDW / PL":"Unscreened.","_todo":"CLIENT DIRECTION 2026-08-14, priority order. PRIMARY: public companies holding disclosed stakes in private space/AI-infrastructure leaders. NVDA's $21B in SpaceX is the model and is already owned free inside a position held for other reasons \u2014 screen for others of that shape, since it converts private-market exposure into something liquid and gate-checkable. SECONDARY, pursue if research supports it: (a) radiation-hardened semiconductors \u2014 the highest-quality bottleneck in the chain, few qualified suppliers, Intel Starfire and Microchip as starting points; (b) launch capacity \u2014 Blue Origin's 51,600-satellite filing and Starcloud need lift, RKLB the main listed pure-play, and the open question is whether launch is a constraint or a commodity; (c) thermal/power/structures \u2014 cooling in vacuum is an unsolved engineering problem, Redwire and satellite component makers. The client noted these are unfamiliar to them, so any position here needs the thesis written for someone starting from zero, not for someone who already follows the sector."},"note":"Honest economics: orbital compute currently costs ~4x terrestrial ($8.64 vs $2.37 per GPU-hour). This is 2027+ optionality, not a 2026 revenue story. Do not let a good narrative become a valuation argument.","sources":["InvestorPlace on Starmind AI1","Fierce Network on space data centers","GeekWire on Starcloud"]},{"id":"physical-ai","name":"Physical AI / robotics / edge inference","thesis":"Inference moving off the data center and into machines that act on the world. Distinct from the buildout trade because the economics are unit-volume driven rather than capex driven.","chatter":"MEDIUM","trajectory":"RISING","capital_committed":"Being named as a distinct investment theme in Asian markets; hardware startup funding concentrating on edge compute and robotics infrastructure.","vehicle_quality":"UNSCREENED","time_to_pnl":"Unclear - the main open question.","status":"WATCHING","vehicles":{"_todo":"No credible screen run yet. Neuromorphic pure-plays like BrainChip trade OTC and are excluded by IPS 8 liquidity and venue rules."},"sources":["Seoul Economic Daily","edge AI funding analyses"]},{"id":"ai-capex-financing","name":"How the AI buildout is actually being financed","thesis":"Hyperscaler 2026 capex expectations ran to roughly $840B, up from $487B in early February. Capex is now growing faster than the revenue it supports. That gap has to be financed somewhere - vendor financing, private credit, SPVs, debt. Follow the money and you find both a risk indicator for the whole desk and possibly a beneficiary.","chatter":"LOW","trajectory":"RISING","capital_committed":"NVIDIA advancing a reported $500B AI infrastructure financing initiative with financial partners. AMD completed a record $5B bond sale.","vehicle_quality":"UNSCREENED","time_to_pnl":"n/a - primarily a risk indicator.","status":"WATCHING","note":"This is the theme most likely to matter to the desk as a WARNING rather than an opportunity. If AI capex is increasingly debt-financed, the buildout becomes rate-sensitive and the whole AI book inherits that sensitivity. Highest-priority monitoring item.","sources":["Axios on hyperscaler capex","Forbes on the capex-to-revenue gap"]}],"_open_questions":["PRIMARY for 2026-08-28: which public companies hold disclosed stakes in private space / AI-infra leaders? NVDA/SpaceX is the template. This converts private exposure into a liquid, gate-checkable position.","Listed SUPPLIERS to private space-compute leaders \u2014 client-directed priority for the 2026-08-28 cycle.","Is there a liquid US-listed pure-play on power transformers? Highest-value unanswered question on this list.","What is the actual debt share of 2026 hyperscaler capex? Determines how rate-sensitive the AI book really is.","Which OFC 2026 suppliers are NOT yet in consensus models? The laser-supply tier has been called mispriced.","Does anything in physical AI clear IPS 8 on liquidity and venue?"],"_lesson_log":[{"date":"2026-08-14","lesson":"Applied the verification standard asymmetrically: demanded primary sources before BUYING, accepted a Medium post before flagging a RISK. Bear claims need the same evidence bar as bull claims. A comfortable-sounding caution is still a claim.","cost":"None \u2014 caught before it changed any position.","fix":"IPS 4 now applies explicitly to risk claims as well as thesis claims."}]},"moonshot_candidates":{"generated":"2026-09-05T22:07:05+00:00","days_back":90,"days_scanned":63,"filings_seen":79334,"purchase_filings":6660,"clusters_found":355,"candidates":[{"ticker":"NONE","issuer":"Blackstone Real Estate Income Trust, Inc.","cik":"0001662972","n_insiders":82,"total_spend":1851 function series(p){
  let nav=p.nav_history||[];
  if(nav.length<2) return null;
  const cut={ "1M":30, "3M":90, "6M":180 }[range];
  if(cut){ const d=new Date(); d.setDate(d.getDate()-cut);
    const iso=d.toISOString().slice(0,10);
    const f=nav.filter(r=>r.date>=iso); if(f.length>=2) nav=f; }
  const base=nav[0].equity||p.starting_cash;
  const labels=nav.map(r=>r.date), eq=nav.map(r=>r.equity);
  const port=eq.map(v=>(v/base)*100);
  const mk=tk=>{const c=(DATA.benchmarks||{})[tk]||{};let b0=null,last=null;
    const o=labels.map(d=>{if(c[d]!=null)last=c[d];if(last==null)return null;
      if(b0==null)b0=last;return (last/b0)*100});
    return o.some(v=>v!=null)?o:null};
  return {labels,port,eq,base,bench:mk(p.benchmark),bn:p.benchmark};
}

  g.addColorStop(0,col+"38"); g.addColorStop(1,col+"03");

  chart=new Chart(el,{type:"line",data:{labels:s.labels,datasets:ds},options:{
    responsive:true,maintainAspectRatio:false,

    plugins:{legend:{display:false},tooltip:{

        ${bd("Vehicle",t.vehicle_quality)}${bd("Time to P&L",t.time_to_pnl)}</div>
      ${t.capital_committed?`<div class="rsec"><span class="lbl">Capital committed</span>
        <div class="rtext" style="margin-top:5px">${esc(t.capital_committed)}</div></div>`:""}
      ${veh?`<div class="rsec"><span class="lbl">Vehicles</span>${veh}</div>`:""}
      ${todo?`<div class="rsec"><span class="lbl">Next</span><div class="rtext" style="margin-top:5px">${esc(todo)}</div></div>`:""}
      ${t.note?`<details><summary>Full note &amp; verification</summary><div class="thesis">${esc(t.note)}</div></details>`:""}
    </div>`}).join("");
  const oq=(wl._open_questions||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  const ll=(wl._lesson_log||[]).map(l=>`<div class="rsec"><span class="lbl">${esc(l.date)} · cost: ${esc(l.cost||"n/a")}</span>
    <div class="rtext" style="margin-top:5px">${esc(l.lesson)}</div>
    ${l.fix?`<div class="rtext" style="margin-top:5px"><b>Fix:</b> ${esc(l.fix)}</div>`:""}</div>`).join("");
  document.getElementById("panel").innerHTML=
    `<div class="card"><h2>Emerging theme radar</h2>
      <p class="note">Low chatter, rising interest — what I'm hunting before it becomes a trade.</p>
      <div class="rgrid">${bd("Last review",wl._last_review)}${bd("Next review",wl._next_review)}
        ${bd("Tracked",String(th.length))}</div></div>`
    +cards
    +(oq?`<div class="card"><h2>Open questions</h2><p class="note">Carried into the next cycle.</p><ul class="rlist">${oq}</ul></div>`:"")
    +(ll?`<div class="card"><h2>Lesson log</h2><p class="note">Mistakes and what changed because of them. Public on purpose.</p>${ll}</div>`:"");
}

function candidates(){
  if(chart){chart.destroy();chart=null}
  const mc=DATA.moonshot_candidates||{}, list=mc.candidates||[];
  const money0=v=>"$"+Math.round(v||0).toLocaleString("en-US");
  const scoreCls=s=>s>=0.7?"bought":s>=0.4?"":"rej";
  const cards=list.map(c=>{
    const cap=c.market_cap?money0(c.market_cap):(c.cap_unknown?"unknown":"—");
    const merged={};
    (c.buys||[]).forEach(b=>{
      const k=(b.insider||"").toLowerCase();
      const m=merged[k]||(merged[k]={insider:b.insider,roles:new Set(),spend:0,dates:new Set()});
      (b.roles||[]).forEach(r=>m.roles.add(r));
      m.spend+=b.spend||0;
      (b.dates||[]).forEach(d=>m.dates.add(d));
    });
    const buys=Object.values(merged).map(b=>`<div class="veh"><b>${esc(b.insider||"")}</b>
      ${esc([...b.roles].join(", "))} — ${money0(b.spend)}
      <span class="dim">(${esc([...b.dates].join(", "))})</span></div>`).join("");
    const edgar=c.cik?`https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${encodeURIComponent(c.cik)}&type=4`:"";
    return `<div class="card">
      <div class="rhead"><h2>${esc(c.ticker)} <span class="dim" style="font-weight:500;font-size:12px">${esc(c.issuer||"")}</span></h2>
        <span class="spill ${scoreCls(c.score)}">score ${(c.score??0).toFixed(2)}</span></div>
      <div class="rgrid">
        <div class="rm"><span class="lbl">Insiders</span><span class="v">${c.n_insiders??"—"}</span></div>
        <div class="rm"><span class="lbl">Total spend</span><span class="v">${money0(c.total_spend)}</span></div>
        <div class="rm"><span class="lbl">Market cap</span><span class="v">${esc(cap)}</span></div>
        <div class="rm"><span class="lbl">Latest buy</span><span class="v">${esc(c.latest_buy||"—")}</span></div>
      </div>
      ${buys?`<div class="rsec"><span class="lbl">Buys</span>${buys}</div>`:""}
      ${edgar?`<div class="rsec"><a href="${edgar}" target="_blank" rel="noopener" class="rtext">View Form 4 filings on EDGAR →</a></div>`:""}
    </div>`}).join("");
  document.getElementById("panel").innerHTML=
    `<div class="card"><h2>Moonshot candidates</h2>
      <p class="note">SEC Form 4 insider-cluster buys — sourcing only. Each still needs
        analyst upside &gt;35%, a dated catalyst inside 18 months, and sentiment
        acceleration (IPS 1) before anything is bought.</p>
      <div class="rgrid">
        <div class="rm"><span class="lbl">Scanned</span><span class="v">${mc.days_scanned??"—"} days</span></div>
        <div class="rm"><span class="lbl">Clusters</span><span class="v">${mc.clusters_found??"—"}</span></div>
        <div class="rm"><span class="lbl">Candidates</span><span class="v">${list.length}</span></div>
        <div class="rm"><span class="lbl">As of</span><span class="v">${mc.generated?new Date(mc.generated).toLocaleDateString("en-US",{month:"short",day:"numeric"}):"—"}</span></div>
      </div>
    </div>`
    +(cards||`<div class="card"><div class="empty">No candidates cleared the filters this run.</div></div>`);
}

/* ======================================================================
   Live quotes -- runs in your browser, costs nothing.

   This is the piece that makes a refresh actually mean something. It fetches
   a current price for every holding and recomputes the book from scratch:
   value, day change, unrealized gain, weights, cash percentage.

   Three rules govern it, and they matter more than the feature does:

   1. It never invents a number. A ticker that fails to quote keeps the price
      baked in at build time. A total that mixes live and stale marks says so.
   2. It never writes anything. State, history and the trade log are the
      server's job. This only changes what you are looking at.
   3. It never blocks the page. The static numbers render first, always. If
      the network is down, or the key is missing, or Finnhub is having a bad
      afternoon, you still get a working dashboard -- just an older one.

   The drawdown figure and the NAV curve deliberately stay at their last
   end-of-day values. The circuit breaker is enforced server-side against
   closing marks, and showing an intraday drawdown next to a rule that does
   not act on intraday drawdowns would be a lie of implication.
   ====================================================================== */
function applyQuotes(px){
  let tEq=0, tDay=0, tPriorBase=0, anyLive=false, anyStale=false;

  for(const k of DATA.order){
    const p=DATA.portfolios[k], hold=p.holdings||[];
    let mv=0, day=0, priorValue=0, dayCounted=false;

    for(const h of hold){
      const q=px[h.ticker];
      if(q){
        h.price=q.c;
        if(q.pc) h.prev_close=q.pc;
        h.mark_source="finnhub live";
        h.live=true;
        anyLive=true;
      }else{
        h.live=false;
        anyStale=true;
      }
      if(h.price!=null){
        h.market_value=h.shares*h.price;
        h.unrealized=h.market_value-h.cost_basis;
        h.unrealized_pct=h.cost_basis?h.unrealized/h.cost_basis:0;
      }
      if(h.price!=null&&h.prev_close){
        h.day_change=h.shares*(h.price-h.prev_close);
        h.day_change_pct=(h.price-h.prev_close)/h.prev_close;
        day+=h.day_change;
        priorValue+=h.shares*h.prev_close;
        dayCounted=true;
      }
      mv+=h.market_value||0;
    }

    p.equity=p.cash+mv;
    for(const h of hold) h.weight=p.equity?(h.market_value||0)/p.equity:0;
    p.cash_pct=p.equity?p.cash/p.equity:0;
    p.total_return=p.starting_cash?(p.equity-p.starting_cash)/p.starting_cash:0;

    /* Percent is measured against the book as it stood at yesterday's close,
       counting only the names we can actually compare. Same convention the
       Python side uses, so the two never disagree. */
    if(dayCounted){
      const priorEquity=p.cash+priorValue;
      p.day_change=day;
      p.day_change_pct=priorEquity?day/priorEquity:null;
      tDay+=day; tPriorBase+=priorEquity;
    }
    tEq+=p.equity;
  }

  DATA.total.equity=tEq;
  DATA.total.return=DATA.total.starting?(tEq-DATA.total.starting)/DATA.total.starting:0;
  if(tPriorBase){
    DATA.total.day_change=tDay;
    DATA.total.day_change_pct=tDay/tPriorBase;
  }
  DATA._live=anyLive;
  DATA._partial=anyLive&&anyStale;
  return anyLive;
}

async function liveQuotes(){
  if(!LIVE_KEY||!DATA) return;
  const tks=[...new Set(DATA.order.flatMap(k=>(DATA.portfolios[k].holdings||[])
    .map(h=>h.ticker)))];
  if(!tks.length) return;

  /* Rebuild the "as built" text from the payload rather than reading whatever
     is on screen -- otherwise a failed second pull appends "unavailable" to a
     stamp that already says "Live", which reads as a contradiction. */
  const stamp=document.getElementById("gen");
  const built="Updated "+new Date(DATA.generated)
    .toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  if(stamp){stamp.textContent="Fetching live prices…"; stamp.classList.remove("live");}

  /* Finnhub's free tier allows 60 calls a minute. Sixteen positions is well
     inside that, but fetch in small waves anyway so a larger book later does
     not quietly start getting throttled and showing stale names. */
  const px={};
  const WAVE=8;
  for(let i=0;i<tks.length;i+=WAVE){
    await Promise.all(tks.slice(i,i+WAVE).map(async t=>{
      try{
        const r=await fetch("https://finnhub.io/api/v1/quote?symbol="+
          encodeURIComponent(t)+"&token="+encodeURIComponent(LIVE_KEY),
          {cache:"no-store"});
        if(!r.ok) return;
        const j=await r.json();
        if(j&&typeof j.c==="number"&&j.c>0)
          px[t]={c:j.c, pc:(typeof j.pc==="number"&&j.pc>0)?j.pc:null};
      }catch(e){ /* one bad ticker must never take down the page */ }
    }));
  }

  const got=Object.keys(px).length;
  if(!got||!applyQuotes(px)){
    if(stamp) stamp.textContent=built+" · live prices unavailable";
    const d=document.querySelector(".dotpulse");
    if(d) d.classList.remove("live","partial");
    return;
  }

  head(); panel();
  const s=document.getElementById("gen");
  if(s){
    const now=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    s.textContent="Live · "+now+(got<tks.length?"  · "+got+"/"+tks.length+" quoted":"");
    s.classList.toggle("live",!DATA._partial);
  }
  const dot=document.querySelector(".dotpulse");
  if(dot){dot.classList.toggle("live",!DATA._partial);
          dot.classList.toggle("partial",!!DATA._partial);}
}

document.getElementById("tbtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
  document.documentElement.setAttribute("data-theme",cur);
  if(DATA)panel();
};

if(DATA){
  head(); tabs(); panel();
  liveQuotes();
  /* Coming back to an already-open tab should not show yesterday's prices.
     Throttled to a minute so leaving it open on a second monitor does not
     hammer the free tier. */
  let lastPull=Date.now();
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"&&Date.now()-lastPull>60000){
      lastPull=Date.now(); liveQuotes();
    }
  });
}
else document.getElementById("panel").innerHTML=
  '<div class="card"><div class="empty">No data yet. Run <code>python -m engine.run daily</code>.</div></div>';
</script>
